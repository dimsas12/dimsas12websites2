[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "elbet"
version = "0.1.0"
description = "EuroLeague basketball betting model: moneyline, spread, totals and player props"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "requests>=2.28",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
elbet = "elbet.cli:main"

[tool.setuptools.packages.find]
include = ["elbet*"]
