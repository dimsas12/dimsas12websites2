<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SVA Viral Pick Video</title>
<style>
  html, body { margin: 0; background: #05070F; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="shaders.js"></script>
<script>
// SVA Consult short-form pick video: cold-open hook, voice-cued motion
// graphics, brand-slash / whip / zoom / glitch transitions, word captions.
// Everything is a pure function of time t, so render.js can step frames.

const W = 1080, H = 1920;
const C = {
  bg: '#05070F', bg2: '#0A1024', blue: '#0A84FF', blueHi: '#4DA8FF', blueDeep: '#0645B8',
  white: '#F5F7FB', grey: '#8A93A8', dim: '#2A3248', red: '#FF3B4E', draw: '#5B6478'
};
const FONT = 'Inter, "Inter Display", sans-serif';
const TR = 0.36;            // transition length (s) for the 2D transitions
const TR_SHADER = 0.7;      // GPU shader transitions need a little longer to read
const CAPTION_Y = 1650;

const main = document.getElementById('c').getContext('2d');
const layer = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const bufA = layer(), bufB = layer(), grainC = document.createElement('canvas');
let ctx = main;             // scenes draw on whatever ctx points at
let D = null, DUR = 30;
const img = {};

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeOutExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeBack = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const easeElastic = k => k <= 0 ? 0 : k >= 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * (2 * Math.PI / 3)) + 1;
const p = (t, a, b, e = easeOut) => e(clamp((t - a) / (b - a)));
const tx = o => o == null ? '' : typeof o === 'string' ? o : (o.en ?? '');
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function font(size, weight = 900, italic = false) { ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${FONT}`; }
function text(s, x, y, size, o = {}) {
  const { weight = 900, color = C.white, align = 'center', alpha = 1, spacing = 0, italic = false, stroke = 0, strokeColor = '#000' } = o;
  if (alpha <= 0) return;
  ctx.save();
  font(size, weight, italic);
  ctx.globalAlpha *= alpha;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (spacing) ctx.letterSpacing = spacing + 'px';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function fitSize(s, maxW, size, weight = 900, italic = true) {
  font(size, weight, italic);
  const w = ctx.measureText(s).width;
  return w > maxW ? size * maxW / w : size;
}
function wrap(str, maxW, size, weight = 700) {
  font(size, weight);
  const lines = []; let cur = '';
  str.split(' ').forEach(w => {
    const tt = cur ? cur + ' ' + w : w;
    if (ctx.measureText(tt).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tt;
  });
  if (cur) lines.push(cur);
  return lines;
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function noGlow() { ctx.shadowBlur = 0; }
function pill(label, x, y, size, k, o = {}) {
  if (k <= 0) return;
  const { fill = 'rgba(10,132,255,.18)', line = C.blue, color = C.white } = o;
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  font(size, 900); ctx.letterSpacing = '3px';
  const w = ctx.measureText(label).width + size * 1.6, h = size * 1.9;
  rrect(-w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = line; ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  text(label, 0, 2, size, { spacing: 3, color });
  ctx.restore();
}
// shockwave ring that expands from a point after time t0
function shock(t, t0, x, y, r0 = 80, r1 = 520, color = C.blue) {
  const k = (t - t0) / .55;
  if (k < 0 || k > 1) return;
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, lerp(r0, r1, easeOut(k)), 0, Math.PI * 2);
  ctx.strokeStyle = color; ctx.globalAlpha *= (1 - k); ctx.lineWidth = 18 * (1 - k) + 2;
  glow(color, 30); ctx.stroke();
  ctx.restore();
}
// burst of particles
function burst(t, t0, x, y, n = 26, color = C.blue) {
  const k = (t - t0) / .8;
  if (k < 0 || k > 1) return;
  ctx.save();
  for (let i = 0; i < n; i++) {
    const an = rnd(i + t0 * 13) * Math.PI * 2, sp = 300 + rnd(i + 5) * 600;
    const d = sp * easeOut(k);
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = i % 3 ? color : C.white;
    ctx.beginPath(); ctx.arc(x + Math.cos(an) * d, y + Math.sin(an) * d, (1 - k) * (6 + rnd(i) * 8), 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function countUp(v, k, dec) { return (v * k).toFixed(dec); }

// voice cue helpers: s.cues / s.words are seconds from the scene start
function cue(s, a, i, fallback) { return s.cues && s.cues[i] != null ? a + s.cues[i] : a + fallback; }
function wordT(s, a, word, fallback) {
  const w = (s.words || []).find(w => w.w.toLowerCase().replace(/[^a-z0-9']/g, '').startsWith(word));
  return w ? a + w.t : a + fallback;
}
const fullName = t => tx(t.full || t);

// ---------- logo ----------
function ring(cx, cy, r, prog, width) {
  ctx.save();
  const g = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
  g.addColorStop(0, C.blueDeep); g.addColorStop(.5, C.blue); g.addColorStop(1, C.blueDeep);
  ctx.strokeStyle = g; ctx.lineWidth = width; ctx.lineCap = 'round';
  glow(C.blue, 40);
  ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * prog); ctx.stroke();
  ctx.restore();
}
function logo(cx, cy, size, k = 1, slashK = 1, ringK = 1) {
  const w = size, h = size * 530 / 600;
  if (ringK > 0) ring(cx, cy + h * .04, size * .82, ringK, Math.max(3, size * .014));
  if (k > 0) {
    ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k);
    ctx.globalAlpha *= clamp(k * 1.4);
    ctx.drawImage(img.white, -w / 2, -h / 2, w, h);
    ctx.restore();
  }
  if (slashK > 0) {
    ctx.save();
    const d = (1 - slashK) * size * .8;
    ctx.translate(cx + d * .5, cy - d * .87);
    ctx.globalAlpha *= clamp(slashK);
    glow(C.blue, 50 * slashK);
    ctx.drawImage(img.blue, -w / 2, -h / 2, w, h);
    ctx.restore();
  }
}

// ---------- background (main canvas) ----------
function background(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const gx = W * .5 + Math.sin(t * .5) * 300, gy = H * .4 + Math.cos(t * .37) * 260;
  let g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 1000);
  g.addColorStop(0, 'rgba(10,132,255,0.22)'); g.addColorStop(1, 'rgba(10,132,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // perspective court floor rushing toward the viewer
  ctx.save();
  const vx = W / 2, vy = 820, floor = H;
  ctx.beginPath(); ctx.rect(0, vy, W, H - vy); ctx.clip();
  // lines fade in from the horizon so there's no seam
  const lg = ctx.createLinearGradient(0, vy, 0, floor);
  lg.addColorStop(0, 'rgba(10,132,255,0)'); lg.addColorStop(.45, 'rgba(10,132,255,.14)'); lg.addColorStop(1, 'rgba(10,132,255,.22)');
  ctx.strokeStyle = lg; ctx.lineWidth = 2;
  for (let i = -12; i <= 12; i++) {
    ctx.beginPath(); ctx.moveTo(vx + i * 14, vy); ctx.lineTo(vx + i * 260, floor); ctx.stroke();
  }
  for (let j = 0; j < 14; j++) {
    const z = ((j + t * 1.6) % 14) / 14;
    const y = vy + (floor - vy) * z * z;
    ctx.globalAlpha = z;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
  // drifting particles
  for (let i = 0; i < 30; i++) {
    const x = rnd(i + 50) * W + Math.sin(t * .8 + i) * 50;
    const y = ((rnd(i + 99) * H - t * (60 + rnd(i + 7) * 120)) % H + H) % H;
    ctx.globalAlpha = .12 + rnd(i + 3) * .3;
    ctx.fillStyle = i % 3 ? C.blue : C.white;
    ctx.beginPath(); ctx.arc(x, y, 2 + rnd(i) * 6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ======================= SCENES =======================
// Each scene draws onto ctx (an off-screen layer) and may register impact
// times in IMPACTS during setup via its `impacts(s, a)` companion.

// --- hook: cold open, "the books say X" -> slashed -> "we say Y"
function sHook(t, a, b, s) {
  const c1 = cue(s, a, 1, 1.6);
  const strike = p(t, c1, c1 + .14);
  const move = p(t, c1 + .05, c1 + .4, easeOutExpo);
  // line 1 is on screen from frame 0 so the thumbnail already hooks
  text(tx(s.line1), W / 2, lerp(520, 330, move), lerp(70, 46, move), { italic: true, spacing: 3, color: lerp(1, 0, move) > .5 ? C.white : C.grey });
  // the market number
  ctx.save();
  ctx.translate(W / 2 + Math.sin(t * 60) * 3 * (1 - strike), lerp(830, 520, move));
  const sc = lerp(1.05 - .05 * p(t, a, a + .4), .42, move);
  ctx.scale(sc, sc);
  text(s.from, 0, 0, fitSize(s.from, 900, 380), { italic: true, color: strike > 0 ? '#C9CED9' : C.white });
  if (strike > 0) {
    ctx.save();
    ctx.strokeStyle = C.red; ctx.lineWidth = 34; ctx.lineCap = 'round'; glow(C.red, 40);
    ctx.beginPath(); ctx.moveTo(-340, 110); ctx.lineTo(lerp(-340, 340, strike), lerp(110, -110, strike)); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  text(tx(s.fromLabel), W / 2, 1060, 52, { italic: true, alpha: 1 - move, color: C.grey, spacing: 6 });
  // our number slams in
  const k = p(t, c1 + .1, c1 + .38, easeOutExpo);
  if (k > 0) {
    ctx.save();
    ctx.translate(W / 2, 960);
    const z = lerp(3.2, 1, k);
    ctx.scale(z, z); ctx.globalAlpha = clamp(k * 2);
    glow(C.blue, 70);
    text(s.to, 0, 0, fitSize(s.to, 860, 420), { italic: true, color: C.blue });
    ctx.restore();
    shock(t, c1 + .38, W / 2, 960, 120, 760);
    burst(t, c1 + .38, W / 2, 960, 34);
    pill(tx(s.toLabel), W / 2, 1250, 44, p(t, c1 + .4, c1 + .65, easeBack));
  }
}

// --- teaser: "match file" cold open -> question gets struck out -> new angle
function hudFrame(t, a, alpha) {
  // corner brackets, scan line and file tag: reads like an analyst's screen
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 5;
  const m = 70, x0 = m, y0 = 300, x1 = W - m, y1 = 1500, L = 70;
  [[x0, y0, 1, 1], [x1, y0, -1, 1], [x0, y1, 1, -1], [x1, y1, -1, -1]].forEach(([x, y, dx, dy]) => {
    ctx.beginPath(); ctx.moveTo(x, y + dy * L); ctx.lineTo(x, y); ctx.lineTo(x + dx * L, y); ctx.stroke();
  });
  const sy = y0 + ((250 + (t - a) * 520) % (y1 - y0));
  const g = ctx.createLinearGradient(0, sy - 60, 0, sy);
  g.addColorStop(0, 'rgba(10,132,255,0)'); g.addColorStop(1, 'rgba(10,132,255,.35)');
  ctx.fillStyle = g; ctx.fillRect(x0, sy - 60, x1 - x0, 60);
  ctx.fillStyle = C.blue; ctx.fillRect(x0, sy, x1 - x0, 3);
  if (Math.floor((t - a) * 2.5) % 2 === 0) { ctx.beginPath(); ctx.arc(x1 - 150, y1 - 50, 9, 0, Math.PI * 2); ctx.fillStyle = C.red; ctx.fill(); }
  text('LIVE', x1 - 130, y1 - 49, 24, { align: 'left', weight: 800, color: C.white, spacing: 3 });
  ctx.restore();
}
function sTeaser(t, a, b, s) {
  const c1 = cue(s, a, 1, 1.4), c2 = cue(s, a, 2, 2.2);
  hudFrame(t, a, 1);
  // file tag types itself out
  const tag = tx(s.kicker);
  text(tag.slice(0, Math.max(0, Math.floor((t - a + .25) / .028))), 140, 360, 28, { align: 'left', weight: 800, color: C.blue, spacing: 4 });
  const move = p(t, c1 + .05, c1 + .4, easeOutExpo);
  text(`${fullName(D.home)}  vs  ${fullName(D.away)}`, W / 2, lerp(640, 470, move), 34, { weight: 800, color: C.grey, spacing: 4, alpha: 1 - move * .4 });
  // the question: on screen from frame 0, then struck out
  const strike = p(t, c1, c1 + .14);
  ctx.save();
  ctx.translate(W / 2 + Math.sin(t * 60) * 3 * (1 - strike), lerp(830, 600, move));
  const z = lerp(1.04 - .04 * p(t, a, a + .4), .5, move); ctx.scale(z, z);
  text(tx(s.question), 0, 0, fitSize(tx(s.question), 900, 200), { italic: true, color: strike > 0 ? '#C9CED9' : C.white });
  if (strike > 0) {
    ctx.save(); ctx.strokeStyle = C.red; ctx.lineWidth = 30; ctx.lineCap = 'round'; glow(C.red, 40);
    ctx.beginPath(); ctx.moveTo(-430, 60); ctx.lineTo(lerp(-430, 430, strike), lerp(60, -60, strike)); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  // "wrong question."
  const wk = p(t, c1 + .08, c1 + .32, easeOutExpo);
  if (wk > 0) {
    ctx.save(); ctx.translate(W / 2, 830); const zz = lerp(2.6, 1, wk); ctx.scale(zz, zz); ctx.globalAlpha *= clamp(wk * 2);
    text(tx(s.answer), 0, 0, fitSize(tx(s.answer), 940, 150), { italic: true });
    ctx.restore();
    shock(t, c1 + .32, W / 2, 830, 120, 700, C.red);
  }
  // "follow the points." + scrambling total
  const fk = p(t, c2 - .05, c2 + .22, easeOutExpo);
  if (fk > 0) {
    ctx.save(); ctx.translate(W / 2, 1030); const zz = lerp(2.2, 1, fk); ctx.scale(zz, zz); ctx.globalAlpha *= clamp(fk * 2);
    glow(C.blue, 50);
    text(tx(s.follow), 0, 0, fitSize(tx(s.follow), 940, 120), { italic: true, color: C.blue });
    ctx.restore();
    const rk = p(t, c2 + .2, c2 + .45, easeBack);
    ctx.save(); ctx.translate(W / 2, 1270); ctx.scale(rk, rk);
    rrect(-300, -95, 600, 190, 30); ctx.fillStyle = 'rgba(10,132,255,.12)'; ctx.fill();
    ctx.strokeStyle = C.blue; ctx.lineWidth = 3; ctx.stroke();
    text(tx(s.counterLabel), 0, -50, 26, { weight: 800, color: C.grey, spacing: 5 });
    const f = Math.floor(t * 24);
    const digits = [0, 1, 2].map(i => String(Math.floor(rnd(f * 3 + i) * 10))).join('');
    ctx.font = `800 96px "JetBrains Mono", monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.white; ctx.fillText(t > b - .5 ? '???' : digits, 0, 30);
    ctx.restore();
  }
}

// --- gauge: speedometer of a value; needle hits the consensus, then swings to ours
function sGauge(t, a, b, s) {
  const c1 = cue(s, a, 1, 1.8);
  const cx = W / 2, cy = 1020, R = 400, lo = s.min ?? 0, hi = s.max ?? 30;
  const ang = v => Math.PI + Math.PI * clamp((v - lo) / (hi - lo));
  text(tx(s.line1), W / 2, 380, 56, { italic: true });
  text(tx(s.line2), W / 2, 450, 30, { weight: 700, color: C.grey, spacing: 5 });
  // track, safe zone and the red "consensus" zone
  ctx.save(); ctx.lineCap = 'butt';
  ctx.lineWidth = 64; ctx.strokeStyle = 'rgba(255,255,255,.07)';
  ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI, 2 * Math.PI); ctx.stroke();
  const zk = 1;
  ctx.strokeStyle = 'rgba(10,132,255,.55)'; glow(C.blue, 25);
  ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI, lerp(Math.PI, ang(s.from), zk)); ctx.stroke();
  ctx.strokeStyle = C.red; glow(C.red, 35);
  ctx.beginPath(); ctx.arc(cx, cy, R, ang(s.from), lerp(ang(s.from), 2 * Math.PI, zk)); ctx.stroke();
  ctx.restore();
  for (let v = lo; v <= hi; v += 5) {
    const an = ang(v);
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(an) * (R - 50), cy + Math.sin(an) * (R - 50));
    ctx.lineTo(cx + Math.cos(an) * (R - 80), cy + Math.sin(an) * (R - 80)); ctx.stroke(); ctx.restore();
    text(String(v), cx + Math.cos(an) * (R - 125), cy + Math.sin(an) * (R - 125), 34, { weight: 800, color: C.grey });
  }
  // needle: sweep to the consensus, hold, then swing back to our number on cue
  // already pinned in the red zone on frame 0 (that's the thumbnail), trembling until our number lands
  const v1 = s.from + Math.sin(t * 40) * .5 * (1 - p(t, a, a + .9));
  const v = t < c1 ? v1 : lerp(s.from, s.to, p(t, c1, c1 + .6, easeElastic));
  const ours = t >= c1 + .1;
  if (t >= c1) {   // ghost marker where the consensus sat
    const an = ang(s.from);
    ctx.save(); ctx.strokeStyle = C.red; ctx.lineWidth = 8; glow(C.red, 20);
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(an) * (R - 36), cy + Math.sin(an) * (R - 36));
    ctx.lineTo(cx + Math.cos(an) * (R + 46), cy + Math.sin(an) * (R + 46)); ctx.stroke(); ctx.restore();
    text(String(s.from), cx + Math.cos(an) * (R + 95), cy + Math.sin(an) * (R + 95), 44, { italic: true, color: C.red });
  }
  const an = ang(v), col = ours ? C.blue : C.red;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(an);
  ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(R - 30, 0); ctx.lineTo(0, 14); ctx.closePath();
  ctx.fillStyle = C.white; glow(col, 40); ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, 44, 0, Math.PI * 2); ctx.fillStyle = col; glow(col, 40); ctx.fill(); noGlow();
  // readout
  ctx.save(); ctx.translate(W / 2, 1230);
  const pz = ours ? 1 + .25 * Math.max(0, 1 - (t - c1 - .5) / .3) : 1; ctx.scale(pz, pz);
  glow(col, 50);
  text(String(Math.round(v)), 0, 0, 230, { italic: true, color: ours ? C.blue : C.white });
  ctx.restore();
  pill(ours ? tx(s.toLabel) : tx(s.fromLabel), W / 2, 1400, 36, 1,
    ours ? {} : { fill: 'rgba(255,59,78,.16)', line: C.red });
  shock(t, c1 + .45, W / 2, 1230, 120, 700);
}

// --- margins: horizontal bars of results against a threshold
function sMargins(t, a, b, s) {
  const c1 = cue(s, a, 1, 1.6);
  text(tx(s.title), W / 2, 320, 72, { italic: true, alpha: p(t, a, a + .2) });
  text(tx(s.subtitle), W / 2, 400, 30, { weight: 700, color: C.grey, spacing: 4, alpha: p(t, a + .1, a + .3) });
  const x0 = 120, x1 = W - 90, max = s.max ?? 30, X = v => lerp(x0, x1, v / max);
  const n = s.games.length, y0 = 560, gap = 280;
  // zone inside the threshold
  const zk = p(t, a + .1, a + .5, easeInOut);
  ctx.save(); ctx.globalAlpha *= zk;
  const g = ctx.createLinearGradient(x0, 0, X(s.threshold), 0);
  g.addColorStop(0, 'rgba(10,132,255,.02)'); g.addColorStop(1, 'rgba(10,132,255,.16)');
  ctx.fillStyle = g; ctx.fillRect(x0, y0 - 40, X(s.threshold) - x0, gap * n);
  ctx.restore();
  text(tx(s.zoneLabel), (x0 + X(s.threshold)) / 2, y0 - 70, 26, { weight: 800, color: C.blue, spacing: 5, alpha: zk });
  s.games.forEach((gm, i) => {
    const y = y0 + i * gap, k = p(t, a + .2 + i * .14, a + .7 + i * .14, easeOutExpo);
    const inside = gm.margin < s.threshold;
    const flash = !inside && t > c1 ? Math.max(0, 1 - (t - c1) / .5) : 0;
    text(tx(gm.label), x0, y + 20, 40, { align: 'left', italic: true, alpha: clamp(k * 2) });
    text(gm.score, x1, y + 20, 32, { align: 'right', weight: 700, color: C.grey, alpha: clamp(k * 2) });
    ctx.save();
    rrect(x0, y + 60, Math.max(.1, (X(gm.margin) - x0) * k), 110, [8, 55, 55, 8]);
    if (inside) { const gg = ctx.createLinearGradient(x0, 0, X(gm.margin), 0); gg.addColorStop(0, C.blueDeep); gg.addColorStop(1, C.blueHi); ctx.fillStyle = gg; glow(C.blue, 35); }
    else ctx.fillStyle = flash > 0 ? C.red : C.draw;
    ctx.fill(); ctx.restore();
    text('−' + Math.round(gm.margin * clamp(k)), x0 + (X(gm.margin) - x0) * k - 30, y + 116, 60,
      { align: 'right', italic: true, alpha: clamp(k * 2) });
  });
  // threshold line
  const lk = p(t, a + .3, a + .7, easeInOut), lx = X(s.threshold);
  ctx.save(); ctx.strokeStyle = C.white; ctx.lineWidth = 5; ctx.setLineDash([20, 12]); glow(C.white, 14);
  ctx.beginPath(); ctx.moveTo(lx, y0 - 40); ctx.lineTo(lx, lerp(y0 - 40, y0 - 40 + gap * n, lk)); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.globalAlpha *= lk;
  rrect(lx - 55, y0 - 40 + gap * n + 10, 110, 50, 25); ctx.fillStyle = C.white; ctx.fill();
  text(String(s.threshold), lx, y0 - 40 + gap * n + 36, 30, { color: C.bg });
  ctx.restore();
  const sk = p(t, c1, c1 + .22, easeOutExpo);

    ctx.save();
    ctx.translate(W / 2, 1480); ctx.rotate(-.05); const z = lerp(2.6, 1, sk); ctx.scale(z, z); ctx.globalAlpha *= clamp(sk * 2);
    font(62, 900, true); ctx.letterSpacing = '4px';
    const w = ctx.measureText(tx(s.stamp)).width + 90;
    rrect(-w / 2, -56, w, 112, 18); ctx.fillStyle = 'rgba(10,132,255,.2)'; ctx.fill();
    ctx.strokeStyle = C.blue; ctx.lineWidth = 7; glow(C.blue, 30); ctx.stroke(); noGlow();
    text(tx(s.stamp), 0, 3, 62, { italic: true, spacing: 4 });
    ctx.restore();
  }
}

// --- schedule: two game tiles (back-to-back) + a minutes bar where the stars sit
function sSchedule(t, a, b, s) {
  const c1 = cue(s, a, 1, 1.6), sit = wordT(s, a, s.sitWord || 'sits', 2.4);
  text(tx(s.title), W / 2, 320, 72, { italic: true, alpha: p(t, a, a + .2) });
  s.tiles.forEach((tl, i) => {
    const k = p(t, a + .1 + i * .18, a + .5 + i * .18, easeBack);
    if (k <= 0) return;
    const x = W / 2 + (i ? 230 : -230), y = 640;
    ctx.save(); ctx.translate(x, y); ctx.scale(k, k); ctx.rotate((1 - k) * (i ? .3 : -.3));
    rrect(-200, -170, 400, 340, 36);
    ctx.fillStyle = i ? 'rgba(255,59,78,.14)' : 'rgba(10,132,255,.16)'; ctx.fill();
    ctx.strokeStyle = i ? C.red : C.blue; ctx.lineWidth = 4; ctx.stroke();
    rrect(-200, -170, 400, 80, [36, 36, 0, 0]); ctx.fillStyle = i ? C.red : C.blue; ctx.fill();
    text(tx(tl.day), 0, -128, 34, { spacing: 4 });
    text(tx(tl.big), 0, 10, 96, { italic: true });
    text(tx(tl.small), 0, 110, 28, { weight: 800, color: C.grey, spacing: 3 });
    ctx.restore();
  });
  // B2B ribbon slams across the second tile
  const rk = p(t, a + .7, a + 1, easeOutExpo);
  if (rk > 0) {
    ctx.save(); ctx.translate(W / 2 + 230, 790); ctx.rotate(-.12); const z = lerp(2.2, 1, rk); ctx.scale(z, z); ctx.globalAlpha *= clamp(rk * 2);
    rrect(-230, -40, 460, 80, 10); ctx.fillStyle = C.red; glow(C.red, 30); ctx.fill(); noGlow();
    text(tx(s.ribbon), 0, 3, 40, { italic: true, spacing: 3 });
    ctx.restore();
  }
  // minutes bar: four quarters; the last one flips to the bench on cue
  const qk = p(t, c1 - .1, c1 + .4, easeInOut);
  if (qk > 0) {
    const x0 = 100, x1 = W - 100, y = 1080, qw = (x1 - x0) / 4;
    text(tx(s.barLabel), W / 2, y - 70, 30, { weight: 800, color: C.grey, spacing: 4, alpha: qk });
    for (let q = 0; q < 4; q++) {
      const k = p(t, c1 - .1 + q * .1, c1 + .3 + q * .1, easeOutExpo);
      const bench = q === 3 && t > sit;
      const fk = q === 3 ? p(t, sit, sit + .3) : 0;
      ctx.save();
      rrect(x0 + q * qw + 6, y, (qw - 12) * k, 120, 18);
      ctx.fillStyle = bench ? `rgba(255,59,78,${.25 + .5 * (1 - fk)})` : C.blue;
      if (!bench) glow(C.blue, 25);
      ctx.fill(); ctx.restore();
      text('Q' + (q + 1), x0 + q * qw + qw / 2, y + 60, 46, { italic: true, alpha: clamp(k * 2) });
    }
    text(tx(s.starsLabel), W / 2 - qw / 2 - 10, y + 190, 32, { weight: 800, color: C.blue, spacing: 3, alpha: qk });
    const bk = p(t, sit, sit + .3, easeBack);
    if (bk > 0) {
      ctx.save(); ctx.translate(x1 - qw / 2, y + 200); ctx.scale(bk, bk);
      pill(tx(s.benchLabel), 0, 0, 30, 1, { fill: 'rgba(255,59,78,.2)', line: C.red });
      ctx.restore();
      text(tx(s.note), W / 2, y + 330, 40, { italic: true, alpha: p(t, sit + .2, sit + .5) });
    }
  }
}

// --- players: two stat rings
function sPlayers(t, a, b, s) {
  const c1 = cue(s, a, 1, 1.6);
  text(tx(s.title), W / 2, 320, 72, { italic: true, alpha: p(t, a, a + .2) });
  s.players.forEach((pl, i) => {
    const t0 = i ? c1 - .1 : a + .1, y = 700 + i * 560;
    const k = p(t, t0, t0 + .35, easeOutExpo);

}

// --- scoreboard: LED projection with rolling digits, then margin comparison
function sScoreboard(t, a, b, s) {
  const c1 = cue(s, a, 1, 1.8), c2 = cue(s, a, 2, 2.6);
  text(tx(s.title), W / 2, 320, 72, { italic: true, alpha: p(t, a, a + .2) });
  const bk = p(t, a + .05, a + .4, easeOutExpo);
  ctx.save(); ctx.translate(W / 2, 640); ctx.scale(lerp(.8, 1, bk), lerp(.8, 1, bk)); ctx.globalAlpha *= bk;
  rrect(-440, -230, 880, 460, 40); ctx.fillStyle = '#03050B'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 4; ctx.stroke();
  // LED dot grid
  ctx.fillStyle = 'rgba(10,132,255,.06)';
  for (let x = -420; x < 420; x += 16) for (let y = -210; y < 210; y += 16) ctx.fillRect(x, y, 4, 4);
  s.rows.forEach((r, i) => {
    const y = -95 + i * 190, lk = p(t, a + .3 + i * .25, a + 1.3 + i * .25, easeOutExpo);
    text(tx(r.team), -390, y, 84, { align: 'left', italic: true, color: i ? C.white : C.blue });
    const f = Math.floor(t * 30);
    const shown = lk >= 1 ? String(r.score) : String(r.score).split('').map((d, j) => lk > .5 + j * .15 ? d : String(Math.floor(rnd(f * 7 + j + i * 3) * 10))).join('');
    ctx.font = `800 150px "JetBrains Mono", monospace`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle = i ? C.white : C.blue; glow(i ? C.white : C.blue, 30);
    ctx.fillText(shown, 400, y + 6); noGlow();
  });
  ctx.restore();
  text(tx(s.tag), W / 2, 920, 28, { weight: 800, color: C.grey, spacing: 6, alpha: bk });
  // margin bars on cue 1
  const items = [[tx(s.consensusLabel), s.consensus, false], [tx(s.modelLabel), s.model, true]];
  items.forEach(([lab, v, hi], i) => {
    const k0 = c1 - .1 + i * .2, k = p(t, k0, k0 + .5, easeOutExpo);
    if (k <= 0) return;
    const y = 1060 + i * 170, x0 = 100, max = s.max ?? 25, wv = (W - 200 - 160) * v / max * k;
    text(lab, x0, y, 30, { align: 'left', weight: 800, color: hi ? C.blue : C.grey, spacing: 4 });

    text(String(Math.round(v * k)), x0 + wv + 20, y + 66, 66, { align: 'left', italic: true, color: hi ? C.blue : C.white });
    if (!hi && t > c2 && s.strike !== false) {   // strike the consensus
      const st = p(t, c2, c2 + .15);
      ctx.save(); ctx.strokeStyle = C.red; ctx.lineWidth = 12; ctx.lineCap = 'round'; glow(C.red, 25);
      ctx.beginPath(); ctx.moveTo(x0 - 10, y + 75); ctx.lineTo(lerp(x0 - 10, x0 + wv + 120, st), y + 55); ctx.stroke(); ctx.restore();
    }

  pill(tx(s.diffLabel), W / 2, 1480, 44, p(t, c2 + .05, c2 + .35, easeBack));
}

// --- called: the pre-game call on a card, then a "CALLED IT" stamp + the real result
function sCalled(t, a, b, s) {
  const c1 = cue(s, a, 1, 1.8);

// --- quarters: per-quarter bars for both teams + the running lead
function sQuarters(t, a, b, s) {
  text(tx(s.title), W / 2, 320, 72, { italic: true, alpha: p(t, a, a + .2) });
  text(tx(s.subtitle), W / 2, 400, 30, { weight: 700, color: C.grey, spacing: 4, alpha: p(t, a + .1, a + .3) });
  const qs = s.quarters, n = qs.length, x0 = 150, x1 = W - 90, slot = (x1 - x0) / n, y0 = 1060, max = s.max ?? 40;
  const Y = v => y0 - 420 * v / max;
  // legend
  [[tx(s.home), C.blue], [tx(s.away), C.draw]].forEach(([lab, col], i) => {
    const lx = W / 2 + (i ? 60 : -340);
    ctx.fillStyle = col; ctx.globalAlpha = p(t, a + .1, a + .3); rrect(lx, 470, 34, 34, 8); ctx.fill(); ctx.globalAlpha = 1;
    text(lab, lx + 50, 488, 32, { align: 'left', italic: true, alpha: p(t, a + .1, a + .3) });
  });
  qs.forEach((q, i) => {
    // Q1 lands on the first line, the rest on the second (the half), all before the verdict
    const t0 = i === 0 ? cue(s, a, 0, .1) : cue(s, a, 1, 1.2) + (i - 1) * .3;
    const k = p(t, t0, t0 + .45, easeOutExpo), cx = x0 + slot * (i + .5), bw = slot * .32;
    [[q[0], C.blue, -1], [q[1], C.draw, 1]].forEach(([v, col, side]) => {
      const top = lerp(y0, Y(v), k);
      ctx.save(); rrect(cx + side * (bw / 2 + 6) - bw / 2, top, bw, Math.max(.1, y0 - top), [14, 14, 4, 4]);
      ctx.fillStyle = col; if (side < 0) glow(C.blue, 30); ctx.fill(); ctx.restore();
      text(String(Math.round(v * k)), cx + side * (bw / 2 + 6), top - 34, 40, { italic: true, alpha: clamp(k * 2), color: side < 0 ? C.white : C.grey });
    });
    text('Q' + (i + 1), cx, y0 + 50, 40, { italic: true, alpha: clamp(k * 2) });
  });
  // running lead line
  let lead = 0;
  const pts = qs.map((q, i) => { lead += q[0] - q[1]; return [x0 + slot * (i + .5), lead]; });
  const ly = v => 1420 - v * 8;
  const lk = p(t, a + .6, a + 2.2, easeInOut);
  text(tx(s.leadLabel), W / 2, 1150, 30, { weight: 800, color: C.grey, spacing: 4, alpha: lk });
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x0, ly(0)); ctx.lineTo(x1, ly(0)); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.beginPath();
  const upto = lk * (pts.length - 1);
  pts.forEach((q, i) => {
    if (i > upto + 1) return;
    const x = i <= upto ? q[0] : lerp(pts[i - 1][0], q[0], upto - (i - 1));
    const v = i <= upto ? q[1] : lerp(pts[i - 1][1], q[1], upto - (i - 1));
    i ? ctx.lineTo(x, ly(v)) : ctx.moveTo(x, ly(v));
  });
  ctx.strokeStyle = C.blue; ctx.lineWidth = 8; ctx.lineJoin = 'round'; glow(C.blue, 30); ctx.stroke(); ctx.restore();
  pts.forEach((q, i) => {
    const k = p(t, a + .6 + i * .4, a + .9 + i * .4, easeBack);
    if (k <= 0) return;
    ctx.save(); ctx.translate(q[0], ly(q[1])); ctx.scale(k, k);
    rrect(-58, -32, 116, 64, 32); ctx.fillStyle = C.blue; ctx.fill();
    text('+' + q[1], 0, 2, 34, { italic: true }); ctx.restore();
  });
  const hk = p(t, cue(s, a, (s.cues || [0, 0]).length - 1, 2.6), cue(s, a, (s.cues || [0, 0]).length - 1, 2.6) + .25, easeOutExpo);
  if (hk > 0) {
    ctx.save(); ctx.translate(W / 2, 1530); ctx.rotate(-.04); const z = lerp(2.4, 1, hk); ctx.scale(z, z); ctx.globalAlpha *= clamp(hk * 2);
    pill(tx(s.verdict), 0, 0, 52, 1, { fill: C.blue, line: C.blue });
    ctx.restore();
  }
}

// --- checklist: the pre-game read, each point ticked off on its voice cue
function sChecklist(t, a, b, s) {

    ctx.save(); ctx.translate((1 - k) * W * (i % 2 ? 1 : -1), 0); ctx.globalAlpha *= clamp(k * 2);

// --- boot: a cold-open "archive" boot-up that hands over to the clip with a flash
function sBoot(t, a, b, s) {
  const c0 = cue(s, a, 0, .2), c1 = cue(s, a, 1, 1.6);
  ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H); ctx.restore();
  // scan lines
  ctx.save(); ctx.globalAlpha = .08; ctx.fillStyle = '#fff';
  for (let y = (t * 120) % 8; y < H; y += 8) ctx.fillRect(0, y, W, 2);
  ctx.restore();
  const tag = tx(s.kicker);
  text(tag.slice(0, Math.max(0, Math.floor((t - a) / .03))), W / 2, 400, 32, { weight: 800, color: C.blue, spacing: 6 });
  // logo assembles out of glitch slices
  const lk = p(t, a + .1, a + .9, easeOutExpo), jit = 1 - lk;
  ctx.save();
  if (jit > .02) {
    const f = Math.floor(t * 30);
    for (let i = 0; i < 6; i++) {
      ctx.save(); ctx.beginPath(); const y0 = 560 + i * 70; ctx.rect(0, y0, W, 70); ctx.clip();
      ctx.translate((rnd(f * 3 + i) - .5) * 300 * jit, 0);
      logo(W / 2, 780, 360, 1, 1, lk);
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .5 * jit;
    ctx.translate(18 * jit, 0); logo(W / 2, 780, 360, 1, 1, 0);
  } else logo(W / 2, 780, 360, 1, 1, 1);
  ctx.restore();
  // "last night's call" with RGB split on entry
  const hk = p(t, c0 + .3, c0 + .6, easeOutExpo);
  if (hk > 0) {
    const g = (1 - hk) * 30;
    [['rgba(255,40,80,.7)', -g], ['rgba(10,132,255,.9)', g], [C.white, 0]].forEach(([col, dx]) => {
      ctx.save(); if (dx) ctx.globalCompositeOperation = 'lighter';
      text(tx(s.line1), W / 2 + dx, 1170, 120, { italic: true, color: col, alpha: clamp(hk * 2) });
      text(tx(s.line2), W / 2 - dx, 1300, 120, { italic: true, color: col === C.white ? C.blue : col, alpha: clamp(hk * 2) });
      ctx.restore();
    });
  }
  // scrambling score
  const sk = p(t, c0 + .6, c0 + .9, easeBack);
  if (sk > 0) {
    ctx.save(); ctx.translate(W / 2, 1490); ctx.scale(sk, sk);
    rrect(-300, -80, 600, 160, 30); ctx.fillStyle = 'rgba(10,132,255,.12)'; ctx.fill();
    ctx.strokeStyle = C.blue; ctx.lineWidth = 3; ctx.stroke();
    const f = Math.floor(t * 24), d = i => String(Math.floor(rnd(f * 5 + i) * 10));
    ctx.font = `800 96px "JetBrains Mono", monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.white; ctx.fillText(t > c1 ? '??? – ??' : d(0) + d(1) + d(2) + ' – ' + d(3) + d(4), 0, 6);
    ctx.restore();
  }
  // white flash into the clip
  const fl = p(t, b - .18, b);
  if (fl > 0) { ctx.save(); ctx.fillStyle = `rgba(255,255,255,${fl})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}

// --- versus: diagonal split panels
function sVersus(t, a, b, s) {
  const c1 = wordT(s, a, (tx(D.away.short || D.away) || 'x').toLowerCase().slice(0, 4), 1.1);
  const sy = x => lerp(1080, 740, x / W);                 // split line y at x
  const hk = p(t, a, a + .3, easeOutExpo), ak = p(t, c1 - .12, c1 + .18, easeOutExpo);
  // top panel (home) slides in from the left
  ctx.save();
  ctx.translate((1 - hk) * -W, 0);
  ctx.beginPath(); ctx.moveTo(0, 240); ctx.lineTo(W, 240); ctx.lineTo(W, sy(W)); ctx.lineTo(0, sy(0)); ctx.closePath();
  let g = ctx.createLinearGradient(0, 240, W, 900);
  g.addColorStop(0, '#111A33'); g.addColorStop(1, '#0B1022');
  ctx.fillStyle = g; ctx.fill();
  ctx.clip();
  for (let i = 0; i < 18; i++) { ctx.fillStyle = 'rgba(255,255,255,.025)'; ctx.fillRect(i * 90 - ((t * 120) % 90), 240, 40, 900); }
  ctx.translate(W / 2, 560); ctx.rotate(-.08);
  const hn = fullName(D.home);

  // bottom panel (away) slams in from the right on cue

    ctx.translate((1 - ak) * W, 0);
    ctx.beginPath(); ctx.moveTo(0, sy(0)); ctx.lineTo(W, sy(W)); ctx.lineTo(W, 1500); ctx.lineTo(0, 1500); ctx.closePath();

    ctx.translate(W / 2, 1190); ctx.rotate(-.08);
    const an = fullName(D.away);

    ctx.beginPath(); ctx.moveTo(0, sy(0)); ctx.lineTo(W * lk, sy(W * lk)); ctx.stroke();

  }
  pill(tx(D.competition), W / 2, 1420, 30, p(t, c1 + .3, c1 + .6, easeBack), { fill: 'rgba(5,7,15,.6)', line: C.white });
}

// --- duel: two giant numbers (e.g. best vs worst defence)
function sDuel(t, a, b, s) {
  const c1 = cue(s, a, s.pulseCue ?? 1, 1.8);
  const bt = wordT(s, a, s.bottom.word || 'worst', 1.0);

  [[s.top, 400, a + .05, false], [s.bottom, 900, bt - .1, true]].forEach(([d, y, t0, hi]) => {
    const k = p(t, t0, t0 + .3, easeOutExpo);

    ctx.translate((1 - k) * (hi ? W : -W), 0);
    rrect(70, y, W - 140, 440, 48);
    ctx.fillStyle = hi ? 'rgba(10,132,255,.16)' : 'rgba(255,255,255,.05)'; ctx.fill();
    ctx.strokeStyle = hi ? C.blue : 'rgba(255,255,255,.2)'; ctx.lineWidth = 3; ctx.stroke();

    text(tx(d.team), W - 130, y + 80, 52, { align: 'right', italic: true, color: hi ? C.blue : C.white });
    const pulse = hi ? 1 + .12 * Math.max(0, 1 - Math.abs(t - c1 - .1) / .2) : 1;

    ctx.restore();
  });

  text(tx(s.note), W / 2, 1420, 32, { color: C.grey, spacing: 3, alpha: p(t, c1, c1 + .3) });
}

// --- totals: game totals vs the line
function sTotals(t, a, b, s) {
  const c1 = cue(s, a, 1, 1.4);
  text(tx(s.title), W / 2, 300, 64, { italic: true, alpha: p(t, a, a + .2) });
  text(tx(s.subtitle), W / 2, 380, 30, { color: C.grey, spacing: 3, alpha: p(t, a + .1, a + .3) });
  const n = s.games.length, x0 = 160, x1 = W - 60, y0 = 1260, y1 = 560;
  const Y = v => lerp(y0, y1, (v - s.min) / (s.max - s.min));
  const slot = (x1 - x0) / n, bw = Math.min(150, slot * .64), ly = Y(s.line);
  s.games.forEach((g, i) => {
    const cx = x0 + slot * (i + .5), k = p(t, a + .1 + i * .08, a + .45 + i * .08, easeBack);
    const over = g.total > s.line, top = lerp(y0, Y(g.total), k);
    const redFlash = s.stampColor !== 'blue' && !over && t > c1 ? Math.max(0, 1 - (t - c1 - i * .05) / .5) : 0;
    ctx.save();

    if (over) { const gr = ctx.createLinearGradient(0, top, 0, y0); gr.addColorStop(0, C.blueHi); gr.addColorStop(1, C.blueDeep); ctx.fillStyle = gr; }
    else ctx.fillStyle = redFlash > 0 ? C.red : C.draw;
    ctx.globalAlpha *= redFlash > 0 ? .6 + .4 * redFlash : 1;
    ctx.fill();
    ctx.restore();
    text(tx(g.label), cx, y0 + 60, fitSize(tx(g.label), slot - 8, 26, 800, false), { weight: 800, alpha: k > 0 ? 1 : 0 });
    text(g.score, cx, y0 + 100, 24, { weight: 600, color: C.grey, alpha: k > 0 ? 1 : 0 });
  });
  const lk = p(t, a + .05, a + .4, easeInOut);
  ctx.save();
  ctx.strokeStyle = C.white; ctx.lineWidth = 5; ctx.setLineDash([20, 12]); glow(C.white, 14);
  ctx.beginPath(); ctx.moveTo(x0, ly); ctx.lineTo(lerp(x0, x1, lk), ly); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.globalAlpha *= lk;
  rrect(x0 - 140, ly - 24, 128, 48, 24); ctx.fillStyle = C.white; ctx.fill();
  text(String(s.line), x0 - 76, ly + 1, 26, { color: C.bg });
  ctx.restore();
  s.games.forEach((g, i) => {
    const cx = x0 + slot * (i + .5), k = p(t, a + .1 + i * .08, a + .45 + i * .08, easeBack);
    const top = lerp(y0, Y(g.total), k), inside = Math.abs(Y(g.total) - 44 - ly) < 28;

  if (sk > 0) {

    ctx.translate(W / 2, 1480); ctx.rotate(-.06); const z = lerp(2.6, 1, sk); ctx.scale(z, z); ctx.globalAlpha *= clamp(sk * 2);

    ctx.strokeStyle = col; ctx.lineWidth = 7; glow(col, 30); ctx.stroke(); noGlow();
    text(tx(s.stamp), 0, 3, 64, { italic: true, spacing: 4, color: C.white });
    ctx.restore();
  }
}

// --- numbers: values slam in one by one on their voice cues, then a result

// --- model: equation + projected total vs the line
function sModel(t, a, b, s) {

    ctx.fillStyle = C.white; ctx.fillRect(X(s.line) - 4, ny - 90, 8, 90);

    ctx.restore();

    ctx.fillStyle = 'rgba(10,132,255,.45)'; ctx.fillRect(X(s.line), ny - 12, mx - X(s.line), 24);
    ctx.beginPath(); ctx.arc(mx, ny, 26, 0, Math.PI * 2); ctx.fillStyle = C.blue; glow(C.blue, 50); ctx.fill();
    ctx.restore();

      rrect(-150, -62, 300, 124, 62); ctx.fillStyle = C.blue; glow(C.blue, 50); ctx.fill(); noGlow();
      text('+' + (total - s.line).toFixed(1), 0, 3, 76, { italic: true });

// --- pick: the reveal
function sPick(t, a, b, s) {
  const c1 = cue(s, a, 1, 1), c2 = cue(s, a, 2, 2), c3 = cue(s, a, s.chipsCue ?? 3, 2.8);
  const tk = p(t, a, a + .25, easeOutExpo);
  ctx.save(); ctx.translate(W / 2, 300); const z = lerp(2.5, 1, tk); ctx.scale(z, z); ctx.globalAlpha *= clamp(tk * 2);
  text(tx(s.title || 'THE PICK'), 0, 0, 110, { italic: true, spacing: 6 });
  ctx.restore();
  const bk = p(t, c1 - .05, c1 + .5, easeElastic);
  if (bk > 0) {
    ctx.save(); ctx.translate(W / 2, 740); ctx.scale(bk, bk);
    for (let r = 0; r < 3; r++) {
      const ph = ((t - c1) * .8 + r / 3) % 1;
      ctx.beginPath(); ctx.arc(0, 0, 290 + ph * 240, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(10,132,255,${.45 * (1 - ph)})`; ctx.lineWidth = 5; ctx.stroke();
    }
    ctx.beginPath();
    for (let j = 0; j <= 96; j++) {
      const an = j / 96 * Math.PI * 2, rr = 280 + Math.sin(an * 4 + t * 3) * 10 + Math.sin(an * 7 - t * 4) * 6;
      j ? ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr) : ctx.moveTo(Math.cos(an) * rr, Math.sin(an) * rr);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(-80, -100, 20, 0, 0, 320);
    g.addColorStop(0, C.blueHi); g.addColorStop(.6, C.blue); g.addColorStop(1, C.blueDeep);
    ctx.fillStyle = g; glow(C.blue, 100); ctx.fill(); noGlow();
    ctx.beginPath(); ctx.ellipse(-110, -150, 70, 32, -.6, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fill();
    text(s.symbol, 0, -40, fitSize(s.symbol, 460, 230), { italic: true });
    text(tx(s.label), 0, 120, fitSize(tx(s.label), 440, 64, 900, false), { spacing: 3 });
    ctx.restore();
    burst(t, c1 + .1, W / 2, 740, 40);
  }
  const ok = s.odds ? p(t, c2 - .05, c2 + .25, easeOutExpo) : 0;   // analysis-only videos have no odds
  if (ok > 0) {
    ctx.save(); ctx.translate(W / 2, 1160); const zz = lerp(2, 1, ok); ctx.scale(zz, zz); ctx.globalAlpha *= clamp(ok * 2);
    text('@' + (1 + (s.odds - 1) * p(t, c2, c2 + .5)).toFixed(2), 0, 0, 170, { italic: true });
    ctx.restore();
    text(s.book || '', W / 2, 1270, 30, { weight: 700, color: C.blue, spacing: 3, alpha: ok });
  }
  const chips = s.chips || [];
  font(40, 900);
  const ws = chips.map(c => ctx.measureText(tx(c)).width + 80), tw = ws.reduce((x, y) => x + y, 0) + (chips.length - 1) * 30;
  let cx = W / 2 - tw / 2;
  chips.forEach((c, i) => {
    const k = p(t, c3 - .1 + i * .12, c3 + .2 + i * .12, easeBack);
    pill(tx(c), cx + ws[i] / 2, s.odds ? 1400 : 1220, 40, k, i ? { fill: 'rgba(255,255,255,.08)', line: C.white } : {});
    cx += ws[i] + 30;
  });
}

// --- outro: logo build + CTA
function sOutro(t, a, b, s) {
  logo(W / 2, 700, 400, p(t, a + .25, a + .55, easeBack), p(t, a + .55, a + .8, easeBack), p(t, a, a + .6, easeInOut));
  const f = p(t, a + .6, a + .7) * (1 - p(t, a + .7, a + 1.1));
  if (f > 0) { ctx.save(); ctx.globalAlpha = f * .5; const g = ctx.createRadialGradient(W / 2, 700, 0, W / 2, 700, 900); g.addColorStop(0, C.blue); g.addColorStop(1, 'rgba(10,132,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  shock(t, a + .55, W / 2, 700, 200, 900);
  const k1 = p(t, a + .8, a + 1.1);
  text('SVA CONSULT', W / 2, 1110, 80, { alpha: k1, spacing: lerp(40, 14, k1) });
  text('SEE THE GAME DIFFERENTLY', W / 2, 1195, 34, { alpha: p(t, a + 1, a + 1.3), color: C.blue, spacing: 6 });
  pill(tx(s.cta || 'FOLLOW FOR DAILY PICKS'), W / 2, 1360, 40, p(t, a + 1.2, a + 1.5, easeBack), { fill: C.blue, line: C.blue });
  if (s.disclaimer !== false) text('18+ · PLAY RESPONSIBLY', W / 2, 1490, 28, { weight: 700, color: C.grey, spacing: 4, alpha: p(t, a + 1.4, a + 1.7) });
}

const SCENES = { boot: sBoot, called: sCalled, quarters: sQuarters, checklist: sChecklist, gauge: sGauge, margins: sMargins, schedule: sSchedule, players: sPlayers, scoreboard: sScoreboard, teaser: sTeaser, hook: sHook, versus: sVersus, duel: sDuel, totals: sTotals, numbers: sNumbers, model: sModel, pick: sPick, outro: sOutro };
// moments that get camera shake + flash + an impact sound
const IMPACTS = {
  teaser: (s, a) => [cue(s, a, 1, 1.4) + .32, cue(s, a, 2, 2.2) + .15],
  gauge: (s, a) => [cue(s, a, 1, 1.8) + .5],
  called: (s, a) => [cue(s, a, 1, 1.8) + .3],
  boot: (s, a) => [a + .7],   // the logo landing; nothing over the voice
  quarters: (s, a) => [cue(s, a, (s.cues || [0, 0]).length - 1, 2.6) + .2],
  checklist: (s, a) => s.items.map((_, i) => cue(s, a, i + 1, .9 + i * .8) + .45),   // after the first word, so names stay clear
  margins: (s, a) => [cue(s, a, 1, 1.6) + .22],
  schedule: (s, a) => [wordT(s, a, s.sitWord || 'sits', 2.4) + .15],
  players: (s, a) => [cue(s, a, 1, 1.6) + .15],
  scoreboard: (s, a) => [cue(s, a, 2, 2.6) + .1],
  hook: (s, a) => [cue(s, a, 1, 1.6) + .38],
  versus: (s, a) => [a + .05, wordT(s, a, (tx(D.away.short || D.away) || 'x').toLowerCase().slice(0, 4), 1.1) + .15],
  duel: (s, a) => [wordT(s, a, s.bottom.word || 'worst', 1) + .2, cue(s, a, s.pulseCue ?? 1, 1.8) + .1],
  totals: (s, a) => [cue(s, a, 1, 1.4) + .2],
  numbers: (s, a) => s.items.map((_, i) => cue(s, a, i + 1, .7 + i * .7) + .2).concat([cue(s, a, s.items.length + 1, .7 + s.items.length * .7) + .1]),
  model: (s, a) => [cue(s, a, 0, 0) + .4, cue(s, a, 1, 1.8) + .6],
  pick: (s, a) => s.odds ? [cue(s, a, 1, 1) + .1, cue(s, a, 2, 2) + .2] : [cue(s, a, 1, 1) + .1],   // nothing on "The pick" so the word stays clear
  outro: (s, a) => [a + .55],
};
const TRANSITIONS = ['slash', 'whip', 'zoom', 'glitch'];

// ======================= COMPOSITOR =======================
let TL = [], CUTS = [], HITS = [], WORDS = [], CHUNKS = [];

function buildTimeline() {
  let a = 0;
  TL = D.scenes.map((s, i) => { const r = { s, a, b: a + (s.len || s.dur), i }; a = r.b; return r; });
  DUR = a;
  CUTS = TL.slice(1).map((r, i) => {
    const type = (D.transitions || TRANSITIONS)[i % (D.transitions || TRANSITIONS).length];
    return { t: r.a, type, d: window.HF_SHADERS && HF_SHADERS[type] ? TR_SHADER : TR };
  });
  HITS = [];
  TL.forEach(r => (IMPACTS[r.s.type] ? IMPACTS[r.s.type](r.s, r.a) : []).forEach(t => HITS.push(t)));
  HITS.sort((x, y) => x - y);
  // captions: words grouped into short punchy chunks
  WORDS = [];
  TL.forEach(r => (r.s.words || []).forEach(w => WORDS.push({ w: w.w, t: r.a + w.t, end: /[.!?…]$/.test(w.w) })));
  // "S, V, A." reads as one word on screen
  for (let i = 0; i < WORDS.length - 1; i++) {
    if (/^[A-Z][,.]?$/.test(WORDS[i].w) && /^[A-Z][,.]?$/.test(WORDS[i + 1].w)) {
      WORDS[i].w = WORDS[i].w.replace(/[,.]/g, '') + WORDS[i + 1].w; WORDS[i].end = WORDS[i + 1].end; WORDS.splice(i + 1, 1); i--;
    }
  }
  CHUNKS = [];
  let cur = [];
  WORDS.forEach(w => {
    cur.push(w);
    const len = cur.map(x => x.w).join(' ').length;
    if (w.end || cur.length >= 3 || len > 15) { CHUNKS.push(cur); cur = []; }
  });
  if (cur.length) CHUNKS.push(cur);
}

function sceneAt(t) { for (const r of TL) if (t >= r.a && t < r.b) return r; return TL[TL.length - 1]; }

function drawScene(r, t, canvas) {
  const c = canvas.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, W, H);
  ctx = c;
  ctx.save();
  // slow push-in keeps every scene moving
  const z = 1 + .04 * clamp((t - r.a) / (r.b - r.a));
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  SCENES[r.s.type](t, r.a, r.b, r.s);
  ctx.restore();
  ctx = main;
}

function impactAmt(t) {
  let amt = 0;
  for (const h of HITS) { const d = t - h; if (d >= 0 && d < .35) amt = Math.max(amt, Math.pow(1 - d / .35, 2)); }
  return amt;
}

function ghost(canvas, x, y, vx, alpha = 1) {
  // motion blur: smear copies along the direction of travel
  const n = 7;
  for (let j = n - 1; j >= 0; j--) {
    main.globalAlpha = alpha * (j === 0 ? 1 : .22 * (1 - j / n));
    main.drawImage(canvas, x - vx * j * .5, y);
  }
  main.globalAlpha = 1;
}

// ---------- GPU shader transitions ----------
const glC = layer(), fullA = layer(), fullB = layer();
let gl = null, quad = null;
const progs = {}, texs = [];
const VERT = 'attribute vec2 a_pos; varying vec2 v_uv; void main(){v_uv=a_pos*0.5+0.5; v_uv.y=1.0-v_uv.y; gl_Position=vec4(a_pos,0,1);}';
function glSetup() {
  gl = glC.getContext('webgl', { preserveDrawingBuffer: true });
  if (!gl) return;
  gl.viewport(0, 0, W, H);
  quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  for (let i = 0; i < 2; i++) {
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
    [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR));
    texs.push(tex);
  }
}
function glProgram(name) {
  if (progs[name]) return progs[name];
  const sh = (src, type) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(name + ': ' + gl.getShaderInfoLog(o)); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(VERT, gl.VERTEX_SHADER)); gl.attachShader(pr, sh(HF_SHADERS[name], gl.FRAGMENT_SHADER));
  gl.linkProgram(pr);
  return (progs[name] = pr);
}
// a scene flattened over the background, as a shader texture needs a full frame
function fullFrame(canvas, r, t, layerCanvas) {
  const c = canvas.getContext('2d');
  ctx = c; c.setTransform(1, 0, 0, 1, 0, 0);
  background(t);
  drawScene(r, t, layerCanvas);
  c.drawImage(layerCanvas, 0, 0);
  ctx = main;
}
function shaderCut(name, out, inn, t, progress) {
  fullFrame(fullA, out, t, bufA);
  fullFrame(fullB, inn, t, bufB);
  const pr = glProgram(name);
  gl.useProgram(pr);
  [fullA, fullB].forEach((c, i) => {
    gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, texs[i]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
  });
  gl.uniform1i(gl.getUniformLocation(pr, 'u_from'), 0);
  gl.uniform1i(gl.getUniformLocation(pr, 'u_to'), 1);
  gl.uniform1f(gl.getUniformLocation(pr, 'u_progress'), progress);
  gl.uniform2f(gl.getUniformLocation(pr, 'u_resolution'), W, H);
  const pos = gl.getAttribLocation(pr, 'a_pos');
  gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  main.drawImage(glC, 0, 0);
}

function compose(t) {
  const cut = CUTS.find(c => Math.abs(t - c.t) < c.d / 2);
  if (!cut) {
    const r = sceneAt(t);
    drawScene(r, t, bufA);
    const amt = impactAmt(t);
    main.save();
    main.translate(W / 2 + Math.sin(t * 97) * 22 * amt, H / 2 + Math.cos(t * 83) * 16 * amt);
    const z = 1 + .05 * amt; main.scale(z, z); main.translate(-W / 2, -H / 2);
    main.drawImage(bufA, 0, 0);
    main.restore();
    if (amt > 0) { main.fillStyle = `rgba(255,255,255,${.16 * amt})`; main.fillRect(0, 0, W, H); }
    return;
  }
  const k = (t - (cut.t - cut.d / 2)) / cut.d, e = easeInOut(k);
  const out = TL.find(r => r.b === cut.t), inn = TL.find(r => r.a === cut.t);
  if (gl && HF_SHADERS[cut.type]) return shaderCut(cut.type, out, inn, t, e);
  drawScene(out, t, bufA);
  drawScene(inn, t, bufB);
  if (cut.type === 'whip') {
    const v = Math.sin(Math.PI * k) * 180;
    ghost(bufA, -W * 1.1 * e, 0, -v);
    ghost(bufB, W * 1.1 * (1 - e), 0, -v);
  } else if (cut.type === 'zoom') {
    main.save(); main.globalAlpha = 1 - e;
    main.translate(W / 2, H / 2); main.scale(1 + 2.2 * e, 1 + 2.2 * e); main.drawImage(bufA, -W / 2, -H / 2); main.restore();
    main.save(); main.globalAlpha = e;
    main.translate(W / 2, H / 2); const z = .45 + .55 * e; main.scale(z, z); main.drawImage(bufB, -W / 2, -H / 2); main.restore();
    main.fillStyle = `rgba(255,255,255,${.6 * (1 - Math.abs(2 * k - 1))})`; main.fillRect(0, 0, W, H);
  } else if (cut.type === 'glitch') {
    const src = k < .5 ? bufA : bufB, amt = 1 - Math.abs(2 * k - 1);
    for (let y = 0; y < H; y += 40) {
      const sh = (rnd(Math.floor(t * 30) * 7 + y) - .5) * 220 * amt;
      main.drawImage(src, 0, y, W, 40, sh, y, W, 40);
    }
    main.save(); main.globalCompositeOperation = 'lighter'; main.globalAlpha = .45 * amt;
    main.drawImage(src, 18 * amt, 0); main.restore();
    for (let i = 0; i < 6; i++) {
      main.fillStyle = i % 2 ? `rgba(10,132,255,${.5 * amt})` : `rgba(255,255,255,${.35 * amt})`;
      main.fillRect(0, rnd(i + Math.floor(t * 30)) * H, W, 6 + rnd(i * 3) * 30);
    }
  } else {
    // brand slash: a skewed blue band (the logo's slash) sweeps across
    const edge = lerp(-500, W + 500, e), sk = .55;
    const ex = y => edge + (H / 2 - y) * sk;
    main.save();
    main.beginPath(); main.moveTo(ex(0), 0); main.lineTo(W + 600, 0); main.lineTo(W + 600, H); main.lineTo(ex(H), H); main.closePath(); main.clip();
    main.drawImage(bufA, 0, 0); main.restore();
    main.save();
    main.beginPath(); main.moveTo(-600, 0); main.lineTo(ex(0) - 260, 0); main.lineTo(ex(H) - 260, H); main.lineTo(-600, H); main.closePath(); main.clip();
    main.drawImage(bufB, 0, 0); main.restore();
    main.save();
    main.beginPath(); main.moveTo(ex(0) - 260, 0); main.lineTo(ex(0), 0); main.lineTo(ex(H), H); main.lineTo(ex(H) - 260, H); main.closePath();
    const g = main.createLinearGradient(ex(H / 2) - 260, 0, ex(H / 2), 0);
    g.addColorStop(0, C.blueDeep); g.addColorStop(1, C.blueHi);
    main.fillStyle = g; main.shadowColor = C.blue; main.shadowBlur = 80; main.fill();
    main.strokeStyle = C.white; main.lineWidth = 8; main.beginPath(); main.moveTo(ex(0), 0); main.lineTo(ex(H), H); main.stroke();
    main.restore();
  }
}

function captions(t) {
  if (t > DUR - .2) return;
  let ci = -1;
  for (let i = 0; i < CHUNKS.length; i++) if (t >= CHUNKS[i][0].t - .02) ci = i;
  if (ci < 0) return;
  const chunk = CHUNKS[ci], last = chunk[chunk.length - 1];
  const next = CHUNKS[ci + 1];
  if (t > (next ? next[0].t : last.t + 1.2) || t > last.t + 1.4) return;
  ctx = main;
  const words = chunk.map(w => w.w.toUpperCase().replace(/[…,.;:!"]/g, ''));
  let size = 84;
  font(size, 900, true);
  const gap = 24;
  let widths = words.map(w => ctx.measureText(w).width);
  let tw = widths.reduce((x, y) => x + y, 0) + gap * (words.length - 1);
  if (tw > 960) { size *= 960 / tw; font(size, 900, true); widths = words.map(w => ctx.measureText(w).width); tw = 960; }
  const pop = p(t, chunk[0].t - .02, chunk[0].t + .1, easeBack);
  main.save();
  main.translate(W / 2, CAPTION_Y); main.scale(lerp(.7, 1, pop), lerp(.7, 1, pop)); main.translate(-W / 2, -CAPTION_Y);
  let x = W / 2 - tw / 2;
  words.forEach((w, i) => {
    const on = t >= chunk[i].t - .02 && (i === words.length - 1 || t < chunk[i + 1].t);
    const wk = on ? p(t, chunk[i].t - .02, chunk[i].t + .08, easeBack) : 0;
    main.save();
    main.translate(x + widths[i] / 2, CAPTION_Y);
    const z = 1 + .12 * (on ? 1 - wk * .6 : 0); main.scale(z, z);
    ctx = main;
    text(w, 0, 0, size, { italic: true, color: on ? C.blue : C.white, stroke: 14, strokeColor: '#02040A', alpha: t >= chunk[i].t - .02 ? 1 : .55 });
    main.restore();
    x += widths[i] + gap;
  });
  main.restore();
}

function overlays(t) {
  ctx = main;
  // progress bar along the top
  main.fillStyle = 'rgba(255,255,255,.1)'; main.fillRect(0, 0, W, 10);
  main.save(); main.fillStyle = C.blue; main.shadowColor = C.blue; main.shadowBlur = 20;
  main.fillRect(0, 0, W * clamp(t / DUR), 10); main.restore();
  // small watermark (the full logo lands at the end)
  const last = TL[TL.length - 1];
  if (t < last.a) {
    main.save(); main.globalAlpha = .85;
    logo(84, 110, 64, 1, 1, 0);
    text('SVA CONSULT', 140, 104, 28, { align: 'left', spacing: 4 });
    main.restore();
  }
  // vignette + grain
  const g = main.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .78);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)');
  main.fillStyle = g; main.fillRect(0, 0, W, H);
  main.save(); main.globalAlpha = .06; main.globalCompositeOperation = 'overlay';
  const ox = Math.floor(rnd(Math.floor(t * 30)) * 256), oy = Math.floor(rnd(Math.floor(t * 30) + 1) * 256);
  main.translate(-ox, -oy); main.fillStyle = main.createPattern(grainC, 'repeat'); main.fillRect(0, 0, W + 256, H + 256);
  main.restore();
}

function render(t) {
  ctx = main;
  main.setTransform(1, 0, 0, 1, 0, 0); main.globalAlpha = 1;
  background(t);
  compose(t);
  captions(t);
  overlays(t);
}

function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
window.timeline = () => ({ scenes: TL.map(r => r.a), dur: DUR, cuts: CUTS.map(c => c.t), hits: HITS,
  pick: (TL.find(r => r.s.type === 'pick') || {}).a });
window.setup = async data => {
  D = data;
  if (!gl) glSetup();
  buildTimeline();
  img.white = await loadImg('assets/mark_white.png');
  img.blue = await loadImg('assets/mark_blue.png');
  grainC.width = grainC.height = 256;
  const gc = grainC.getContext('2d'), id = gc.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = rnd(i) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gc.putImageData(id, 0, 0);
  await document.fonts.load('900 40px Inter');
  await document.fonts.load('italic 900 40px Inter');
  return DUR;
};
window.render = render;

// live preview: template.html?pick=picks/pao-milan.json
(async () => {
  const q = new URLSearchParams(location.search);
  if (!q.get('pick')) return;
  await window.setup(await (await fetch(q.get('pick'))).json());
  const t0 = performance.now();
  const loop = () => { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  loop();
})();
</script>
