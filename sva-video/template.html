<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SVA Viral Pick Video</title>
<style>
  html, body { margin: 0; background: #05070F; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// SVA Consult short-form pick video: cold-open hook, voice-cued motion
// graphics, brand-slash / whip / zoom / glitch transitions, word captions.
// Everything is a pure function of time t, so render.js can step frames.

const W = 1080, H = 1920;
const C = {
  bg: '#05070F', bg2: '#0A1024', blue: '#0A84FF', blueHi: '#4DA8FF', blueDeep: '#0645B8',
  white: '#F5F7FB', grey: '#8A93A8', dim: '#2A3248', red: '#FF3B4E', draw: '#5B6478'
};
const FONT = 'Inter, "Inter Display", sans-serif';
const TR = 0.36;            // transition length (s)
const CAPTION_Y = 1650;

const main = document.getElementById('c').getContext('2d');
const layer = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const bufA = layer(), bufB = layer(), grainC = document.createElement('canvas');
let ctx = main;             // scenes draw on whatever ctx points at
let D = null, DUR = 30;
const img = {};

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeOutExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeBack = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const easeElastic = k => k <= 0 ? 0 : k >= 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * (2 * Math.PI / 3)) + 1;
const p = (t, a, b, e = easeOut) => e(clamp((t - a) / (b - a)));
const tx = o => o == null ? '' : typeof o === 'string' ? o : (o.en ?? '');
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function font(size, weight = 900, italic = false) { ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${FONT}`; }
function text(s, x, y, size, o = {}) {
  const { weight = 900, color = C.white, align = 'center', alpha = 1, spacing = 0, italic = false, stroke = 0, strokeColor = '#000' } = o;
  if (alpha <= 0) return;
  ctx.save();
  font(size, weight, italic);
  ctx.globalAlpha *= alpha;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (spacing) ctx.letterSpacing = spacing + 'px';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function fitSize(s, maxW, size, weight = 900, italic = true) {
  font(size, weight, italic);
  const w = ctx.measureText(s).width;
  return w > maxW ? size * maxW / w : size;
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function noGlow() { ctx.shadowBlur = 0; }
function pill(label, x, y, size, k, o = {}) {
  if (k <= 0) return;
  const { fill = 'rgba(10,132,255,.18)', line = C.blue, color = C.white } = o;
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  font(size, 900); ctx.letterSpacing = '3px';
  const w = ctx.measureText(label).width + size * 1.6, h = size * 1.9;
  rrect(-w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = line; ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  text(label, 0, 2, size, { spacing: 3, color });
  ctx.restore();
}
// shockwave ring that expands from a point after time t0
function shock(t, t0, x, y, r0 = 80, r1 = 520, color = C.blue) {
  const k = (t - t0) / .55;
  if (k < 0 || k > 1) return;
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, lerp(r0, r1, easeOut(k)), 0, Math.PI * 2);
  ctx.strokeStyle = color; ctx.globalAlpha *= (1 - k); ctx.lineWidth = 18 * (1 - k) + 2;
  glow(color, 30); ctx.stroke();
  ctx.restore();
}
// burst of particles
function burst(t, t0, x, y, n = 26, color = C.blue) {
  const k = (t - t0) / .8;
  if (k < 0 || k > 1) return;
  ctx.save();
  for (let i = 0; i < n; i++) {
    const an = rnd(i + t0 * 13) * Math.PI * 2, sp = 300 + rnd(i + 5) * 600;
    const d = sp * easeOut(k);
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = i % 3 ? color : C.white;
    ctx.beginPath(); ctx.arc(x + Math.cos(an) * d, y + Math.sin(an) * d, (1 - k) * (6 + rnd(i) * 8), 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function countUp(v, k, dec) { return (v * k).toFixed(dec); }

// voice cue helpers: s.cues / s.words are seconds from the scene start
function cue(s, a, i, fallback) { return s.cues && s.cues[i] != null ? a + s.cues[i] : a + fallback; }
function wordT(s, a, word, fallback) {
  const w = (s.words || []).find(w => w.w.toLowerCase().replace(/[^a-z0-9']/g, '').startsWith(word));
  return w ? a + w.t : a + fallback;
}
const fullName = t => tx(t.full || t);

// ---------- logo ----------
function ring(cx, cy, r, prog, width) {
  ctx.save();
  const g = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
  g.addColorStop(0, C.blueDeep); g.addColorStop(.5, C.blue); g.addColorStop(1, C.blueDeep);
  ctx.strokeStyle = g; ctx.lineWidth = width; ctx.lineCap = 'round';
  glow(C.blue, 40);
  ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * prog); ctx.stroke();
  ctx.restore();
}
function logo(cx, cy, size, k = 1, slashK = 1, ringK = 1) {
  const w = size, h = size * 530 / 600;
  if (ringK > 0) ring(cx, cy + h * .04, size * .82, ringK, Math.max(3, size * .014));
  if (k > 0) {
    ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k);
    ctx.globalAlpha *= clamp(k * 1.4);
    ctx.drawImage(img.white, -w / 2, -h / 2, w, h);
    ctx.restore();
  }
  if (slashK > 0) {
    ctx.save();
    const d = (1 - slashK) * size * .8;
    ctx.translate(cx + d * .5, cy - d * .87);
    ctx.globalAlpha *= clamp(slashK);
    glow(C.blue, 50 * slashK);
    ctx.drawImage(img.blue, -w / 2, -h / 2, w, h);
    ctx.restore();
  }
}

// ---------- background (main canvas) ----------
function background(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const gx = W * .5 + Math.sin(t * .5) * 300, gy = H * .4 + Math.cos(t * .37) * 260;
  let g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 1000);
  g.addColorStop(0, 'rgba(10,132,255,0.22)'); g.addColorStop(1, 'rgba(10,132,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // perspective court floor rushing toward the viewer
  ctx.save();
  const vx = W / 2, vy = 820, floor = H;
  ctx.beginPath(); ctx.rect(0, vy, W, H - vy); ctx.clip();
  // lines fade in from the horizon so there's no seam
  const lg = ctx.createLinearGradient(0, vy, 0, floor);
  lg.addColorStop(0, 'rgba(10,132,255,0)'); lg.addColorStop(.45, 'rgba(10,132,255,.14)'); lg.addColorStop(1, 'rgba(10,132,255,.22)');
  ctx.strokeStyle = lg; ctx.lineWidth = 2;
  for (let i = -12; i <= 12; i++) {
    ctx.beginPath(); ctx.moveTo(vx + i * 14, vy); ctx.lineTo(vx + i * 260, floor); ctx.stroke();
  }
  for (let j = 0; j < 14; j++) {
    const z = ((j + t * 1.6) % 14) / 14;
    const y = vy + (floor - vy) * z * z;
    ctx.globalAlpha = z;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
  // drifting particles
  for (let i = 0; i < 30; i++) {
    const x = rnd(i + 50) * W + Math.sin(t * .8 + i) * 50;
    const y = ((rnd(i + 99) * H - t * (60 + rnd(i + 7) * 120)) % H + H) % H;
    ctx.globalAlpha = .12 + rnd(i + 3) * .3;
    ctx.fillStyle = i % 3 ? C.blue : C.white;
    ctx.beginPath(); ctx.arc(x, y, 2 + rnd(i) * 6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ======================= SCENES =======================
// Each scene draws onto ctx (an off-screen layer) and may register impact
// times in IMPACTS during setup via its `impacts(s, a)` companion.

// --- hook: cold open, "the books say X" -> slashed -> "we say Y"
function sHook(t, a, b, s) {
  const c1 = cue(s, a, 1, 1.6);
  const strike = p(t, c1, c1 + .14);
  const move = p(t, c1 + .05, c1 + .4, easeOutExpo);
  // line 1 is on screen from frame 0 so the thumbnail already hooks
  text(tx(s.line1), W / 2, lerp(520, 330, move), lerp(70, 46, move), { italic: true, spacing: 3, color: lerp(1, 0, move) > .5 ? C.white : C.grey });
  // the market number
  ctx.save();
  ctx.translate(W / 2 + Math.sin(t * 60) * 3 * (1 - strike), lerp(830, 520, move));
  const sc = lerp(1.05 - .05 * p(t, a, a + .4), .42, move);
  ctx.scale(sc, sc);
  text(s.from, 0, 0, fitSize(s.from, 900, 380), { italic: true, color: strike > 0 ? '#C9CED9' : C.white });
  if (strike > 0) {
    ctx.save();
    ctx.strokeStyle = C.red; ctx.lineWidth = 34; ctx.lineCap = 'round'; glow(C.red, 40);
    ctx.beginPath(); ctx.moveTo(-340, 110); ctx.lineTo(lerp(-340, 340, strike), lerp(110, -110, strike)); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  text(tx(s.fromLabel), W / 2, 1060, 52, { italic: true, alpha: 1 - move, color: C.grey, spacing: 6 });
  // our number slams in
  const k = p(t, c1 + .1, c1 + .38, easeOutExpo);
  if (k > 0) {
    ctx.save();
    ctx.translate(W / 2, 960);
    const z = lerp(3.2, 1, k);
    ctx.scale(z, z); ctx.globalAlpha = clamp(k * 2);
    glow(C.blue, 70);
    text(s.to, 0, 0, fitSize(s.to, 860, 420), { italic: true, color: C.blue });
    ctx.restore();
    shock(t, c1 + .38, W / 2, 960, 120, 760);
    burst(t, c1 + .38, W / 2, 960, 34);
    pill(tx(s.toLabel), W / 2, 1250, 44, p(t, c1 + .4, c1 + .65, easeBack));
  }
}

// --- versus: diagonal split panels
function sVersus(t, a, b, s) {
  const c1 = wordT(s, a, (tx(D.away.short || D.away) || 'x').toLowerCase().slice(0, 4), 1.1);
  const sy = x => lerp(1080, 740, x / W);                 // split line y at x
  const hk = p(t, a, a + .3, easeOutExpo), ak = p(t, c1 - .12, c1 + .18, easeOutExpo);
  // top panel (home) slides in from the left
  ctx.save();
  ctx.translate((1 - hk) * -W, 0);
  ctx.beginPath(); ctx.moveTo(0, 240); ctx.lineTo(W, 240); ctx.lineTo(W, sy(W)); ctx.lineTo(0, sy(0)); ctx.closePath();
  let g = ctx.createLinearGradient(0, 240, W, 900);
  g.addColorStop(0, '#111A33'); g.addColorStop(1, '#0B1022');
  ctx.fillStyle = g; ctx.fill();
  ctx.clip();
  for (let i = 0; i < 18; i++) { ctx.fillStyle = 'rgba(255,255,255,.025)'; ctx.fillRect(i * 90 - ((t * 120) % 90), 240, 40, 900); }
  ctx.translate(W / 2, 560); ctx.rotate(-.08);
  const hn = fullName(D.home);
  text(hn, 0, 0, fitSize(hn, 920, 170), { italic: true });
  text(D.home.record || '', 0, 170, 110, { italic: true, color: C.grey });
  ctx.restore();
  // bottom panel (away) slams in from the right on cue
  if (ak > 0) {
    ctx.save();
    ctx.translate((1 - ak) * W, 0);
    ctx.beginPath(); ctx.moveTo(0, sy(0)); ctx.lineTo(W, sy(W)); ctx.lineTo(W, 1500); ctx.lineTo(0, 1500); ctx.closePath();
    g = ctx.createLinearGradient(0, 800, W, 1500);
    g.addColorStop(0, C.blueDeep); g.addColorStop(1, C.blue);
    ctx.fillStyle = g; ctx.fill();
    ctx.clip();
    for (let i = 0; i < 18; i++) { ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(i * 90 + ((t * 120) % 90), 700, 40, 900); }
    ctx.translate(W / 2, 1190); ctx.rotate(-.08);
    const an = fullName(D.away);
    text(an, 0, 0, fitSize(an, 920, 170), { italic: true });
    text(D.away.record || '', 0, 170, 110, { italic: true, color: 'rgba(255,255,255,.75)' });
    ctx.restore();
  }
  // split line + VS
  const lk = p(t, c1, c1 + .2);
  if (lk > 0) {
    ctx.save();
    ctx.strokeStyle = C.white; ctx.lineWidth = 10; glow(C.white, 30);
    ctx.beginPath(); ctx.moveTo(0, sy(0)); ctx.lineTo(W * lk, sy(W * lk)); ctx.stroke();
    ctx.restore();
    const v = p(t, c1 + .1, c1 + .45, easeElastic);
    ctx.save(); ctx.translate(W / 2, sy(W / 2)); ctx.scale(v, v); ctx.rotate((1 - v) * 2);
    ctx.beginPath(); ctx.arc(0, 0, 105, 0, Math.PI * 2); ctx.fillStyle = C.white; glow(C.blue, 50); ctx.fill(); noGlow();
    text('VS', 0, 4, 84, { italic: true, color: C.bg });
    ctx.restore();
  }
  pill(tx(D.competition), W / 2, 1420, 30, p(t, c1 + .3, c1 + .6, easeBack), { fill: 'rgba(5,7,15,.6)', line: C.white });
}

// --- duel: two giant numbers (e.g. best vs worst defence)
function sDuel(t, a, b, s) {
  const c1 = cue(s, a, s.pulseCue ?? 1, 1.8);
  const bt = wordT(s, a, s.bottom.word || 'worst', 1.0);
  text(tx(s.title), W / 2, 300, 40, { italic: true, color: C.grey, spacing: 5, alpha: p(t, a, a + .2) });
  [[s.top, 400, a + .05, false], [s.bottom, 900, bt - .1, true]].forEach(([d, y, t0, hi]) => {
    const k = p(t, t0, t0 + .3, easeOutExpo);
    if (k <= 0) return;
    ctx.save();
    ctx.translate((1 - k) * (hi ? W : -W), 0);
    rrect(70, y, W - 140, 440, 48);
    ctx.fillStyle = hi ? 'rgba(10,132,255,.16)' : 'rgba(255,255,255,.05)'; ctx.fill();
    ctx.strokeStyle = hi ? C.blue : 'rgba(255,255,255,.2)'; ctx.lineWidth = 3; ctx.stroke();
    pill(tx(d.label), 330, y + 80, 30, 1, hi ? {} : { fill: 'rgba(255,255,255,.08)', line: C.white });
    text(tx(d.team), W - 130, y + 80, 52, { align: 'right', italic: true, color: hi ? C.blue : C.white });
    const pulse = hi ? 1 + .12 * Math.max(0, 1 - Math.abs(t - c1 - .1) / .2) : 1;
    ctx.save(); ctx.translate(W / 2, y + 270); ctx.scale(pulse, pulse);
    if (hi) glow(C.blue, 60);
    text(countUp(d.value, p(t, t0 + .1, t0 + .7), d.dec ?? 1), 0, 0, 230, { italic: true, color: hi ? C.blue : C.white });
    ctx.restore();
    ctx.restore();
  });
  shock(t, c1 + .1, W / 2, 1170, 160, 700);
  text(tx(s.note), W / 2, 1420, 32, { color: C.grey, spacing: 3, alpha: p(t, c1, c1 + .3) });
}

// --- totals: game totals vs the line
function sTotals(t, a, b, s) {
  const c1 = cue(s, a, 1, 1.4);
  text(tx(s.title), W / 2, 300, 64, { italic: true, alpha: p(t, a, a + .2) });
  text(tx(s.subtitle), W / 2, 380, 30, { color: C.grey, spacing: 3, alpha: p(t, a + .1, a + .3) });
  const n = s.games.length, x0 = 160, x1 = W - 60, y0 = 1260, y1 = 560;
  const Y = v => lerp(y0, y1, (v - s.min) / (s.max - s.min));
  const slot = (x1 - x0) / n, bw = Math.min(150, slot * .64), ly = Y(s.line);
  s.games.forEach((g, i) => {
    const cx = x0 + slot * (i + .5), k = p(t, a + .1 + i * .08, a + .45 + i * .08, easeBack);
    const over = g.total > s.line, top = lerp(y0, Y(g.total), k);
    const redFlash = s.stampColor !== 'blue' && !over && t > c1 ? Math.max(0, 1 - (t - c1 - i * .05) / .5) : 0;
    ctx.save();
    if (over) glow(C.blue, 40);
    rrect(cx - bw / 2, top, bw, Math.max(.1, y0 - top), [18, 18, 4, 4]);
    if (over) { const gr = ctx.createLinearGradient(0, top, 0, y0); gr.addColorStop(0, C.blueHi); gr.addColorStop(1, C.blueDeep); ctx.fillStyle = gr; }
    else ctx.fillStyle = redFlash > 0 ? C.red : C.draw;
    ctx.globalAlpha *= redFlash > 0 ? .6 + .4 * redFlash : 1;
    ctx.fill();
    ctx.restore();
    text(tx(g.label), cx, y0 + 60, fitSize(tx(g.label), slot - 8, 26, 800, false), { weight: 800, alpha: k > 0 ? 1 : 0 });
    text(g.score, cx, y0 + 100, 24, { weight: 600, color: C.grey, alpha: k > 0 ? 1 : 0 });
  });
  const lk = p(t, a + .05, a + .4, easeInOut);
  ctx.save();
  ctx.strokeStyle = C.white; ctx.lineWidth = 5; ctx.setLineDash([20, 12]); glow(C.white, 14);
  ctx.beginPath(); ctx.moveTo(x0, ly); ctx.lineTo(lerp(x0, x1, lk), ly); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.globalAlpha *= lk;
  rrect(x0 - 140, ly - 24, 128, 48, 24); ctx.fillStyle = C.white; ctx.fill();
  text(String(s.line), x0 - 76, ly + 1, 26, { color: C.bg });
  ctx.restore();
  s.games.forEach((g, i) => {
    const cx = x0 + slot * (i + .5), k = p(t, a + .1 + i * .08, a + .45 + i * .08, easeBack);
    const top = lerp(y0, Y(g.total), k), inside = Math.abs(Y(g.total) - 44 - ly) < 28;
    ctx.save(); glow(C.bg, 16);
    text(String(Math.round(g.total * clamp(k))), cx, inside ? top + 44 : top - 44, 46, { alpha: clamp(k * 2), color: g.total > s.line || inside ? C.white : C.grey });
    ctx.restore();
  });
  // verdict stamp
  const sk = p(t, c1, c1 + .22, easeOutExpo);
  if (sk > 0) {
    ctx.save();
    ctx.translate(W / 2, 1480); ctx.rotate(-.06); const z = lerp(2.6, 1, sk); ctx.scale(z, z); ctx.globalAlpha *= clamp(sk * 2);
    font(64, 900, true); ctx.letterSpacing = '4px';
    const w = ctx.measureText(tx(s.stamp)).width + 90, col = s.stampColor === 'blue' ? C.blue : C.red;
    rrect(-w / 2, -58, w, 116, 18); ctx.fillStyle = s.stampColor === 'blue' ? 'rgba(10,132,255,.2)' : 'rgba(255,59,78,.15)'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 7; glow(col, 30); ctx.stroke(); noGlow();
    text(tx(s.stamp), 0, 3, 64, { italic: true, spacing: 4, color: C.white });
    ctx.restore();
  }
}

// --- numbers: values slam in one by one on their voice cues, then a result
function sNumbers(t, a, b, s) {
  text(tx(s.title), W / 2, 320, 76, { italic: true, alpha: p(t, a, a + .2) });
  const n = s.items.length;
  s.items.forEach((it, i) => {
    const t0 = cue(s, a, i + 1, .7 + i * .7) - .05;
    const k = p(t, t0, t0 + .25, easeOutExpo);
    if (k <= 0) return;
    const y = 560 + i * 300, hi = s.line != null && it.value > s.line;
    ctx.save(); ctx.translate(W / 2, y);
    const z = lerp(2.4, 1, k); ctx.scale(z, z); ctx.globalAlpha *= clamp(k * 2);
    if (hi) glow(C.blue, 50);
    text(String(it.value), 0, 0, 230, { italic: true, color: hi ? C.blue : C.white });
    ctx.restore();
    text(tx(it.label), W / 2, y + 140, 30, { weight: 700, color: C.grey, spacing: 3, alpha: k });
  });
  const t1 = cue(s, a, n + 1, .7 + n * .7) - .05;
  const rk = p(t, t1, t1 + .35, easeElastic);
  if (rk > 0) {
    ctx.save(); ctx.translate(W / 2, 1230 + n * 0); ctx.scale(rk, rk);
    rrect(-330, -95, 660, 190, 95); ctx.fillStyle = C.blue; glow(C.blue, 60); ctx.fill(); noGlow();
    text(`${tx(s.result.label)} ${s.result.value}`, 0, 4, 84, { italic: true });
    ctx.restore();
    if (s.line != null) {
      const diff = s.result.value - s.line;
      text(`${diff >= 0 ? '+' : ''}${diff.toFixed(1)} vs LINE ${s.line}`, W / 2, 1400, 40, { color: diff >= 0 ? C.blue : C.red, alpha: p(t, t1 + .3, t1 + .5), spacing: 3 });
    }
    shock(t, t1 + .1, W / 2, 1230, 200, 700);
  }
}

// --- model: equation + projected total vs the line
function sModel(t, a, b, s) {
  const c0 = cue(s, a, 0, 0), c1 = cue(s, a, 1, 1.8);
  const total = s.homePts + s.awayPts;
  text(tx(s.title || 'OUR MODEL'), W / 2, 300, 76, { italic: true, alpha: p(t, a, a + .2) });
  [[D.home, s.homePts, 290, false, -1], [D.away, s.awayPts, 790, true, 1]].forEach(([team, v, x, hi, dir]) => {
    const k = p(t, a + .05, a + .35, easeOutExpo);
    ctx.save(); ctx.translate(x + (1 - k) * dir * W, 520);
    rrect(-215, -105, 430, 210, 40);
    ctx.fillStyle = hi ? C.blue : C.bg2; if (hi) glow(C.blue, 40); ctx.fill(); noGlow();
    if (!hi) { ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 3; ctx.stroke(); }
    text(tx(team), 0, -55, 30, { weight: 800, spacing: 4, color: hi ? C.white : C.grey });
    text(countUp(v, p(t, a + .2, a + .8), 1), 0, 28, 92, { italic: true });
    ctx.restore();
  });
  text('+', W / 2, 520, 90, { color: C.blue, alpha: p(t, a + .3, a + .4) });
  const tk = p(t, c0 + .3, c0 + 1.2, easeOutExpo);
  const totK = p(t, c0 + .2, c0 + .4, easeBack);
  if (totK > 0) {
    ctx.save(); ctx.translate(W / 2, 820); ctx.scale(totK, totK); glow(C.blue, 40);
    text('= ' + countUp(total, tk, 1), 0, 0, 200, { italic: true });
    ctx.restore();
    text(tx(s.totalLabel || 'PROJECTED TOTAL'), W / 2, 950, 32, { color: C.blue, spacing: 6, alpha: totK });
  }
  // number line on cue 1
  const lo = Math.floor(Math.min(s.line, total) / 2) * 2 - 2, hi = Math.ceil(Math.max(s.line, total) / 2) * 2 + 2;
  const x0 = 110, x1 = W - 110, ny = 1250, X = v => lerp(x0, x1, (v - lo) / (hi - lo));
  const nk = p(t, c1 - .3, c1, easeInOut);
  if (nk > 0) {
    ctx.save(); ctx.globalAlpha *= nk;
    ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(x0, ny - 4, (x1 - x0) * nk, 8);
    for (let v = lo; v <= hi; v += 2) { ctx.fillRect(X(v) - 2, ny - 16, 4, 32); text(String(v), X(v), ny + 52, 26, { weight: 600, color: C.grey }); }
    ctx.fillStyle = C.white; ctx.fillRect(X(s.line) - 4, ny - 90, 8, 90);
    text((s.lineLabel || 'LINE') + ' ' + s.line, X(s.line) - 18, ny - 70, 30, { align: 'right', weight: 800, color: C.grey });
    ctx.restore();
    const mk = p(t, c1, c1 + .5, easeOutExpo);
    const mx = X(lerp(s.line, total, mk));
    ctx.save();
    ctx.fillStyle = 'rgba(10,132,255,.45)'; ctx.fillRect(X(s.line), ny - 12, mx - X(s.line), 24);
    ctx.beginPath(); ctx.arc(mx, ny, 26, 0, Math.PI * 2); ctx.fillStyle = C.blue; glow(C.blue, 50); ctx.fill();
    ctx.restore();
    const dk = p(t, c1 + .45, c1 + .7, easeBack);
    if (dk > 0) {
      ctx.save(); ctx.translate((X(s.line) + X(total)) / 2 + 60, ny - 170); ctx.scale(dk, dk); ctx.rotate(-.05);
      rrect(-150, -62, 300, 124, 62); ctx.fillStyle = C.blue; glow(C.blue, 50); ctx.fill(); noGlow();
      text('+' + (total - s.line).toFixed(1), 0, 3, 76, { italic: true });
      ctx.restore();
      shock(t, c1 + .6, (X(s.line) + X(total)) / 2 + 60, ny - 170, 90, 420);
    }
  }
}

// --- pick: the reveal
function sPick(t, a, b, s) {
  const c1 = cue(s, a, 1, 1), c2 = cue(s, a, 2, 2), c3 = cue(s, a, s.chipsCue ?? 3, 2.8);
  const tk = p(t, a, a + .25, easeOutExpo);
  ctx.save(); ctx.translate(W / 2, 300); const z = lerp(2.5, 1, tk); ctx.scale(z, z); ctx.globalAlpha *= clamp(tk * 2);
  text(tx(s.title || 'THE PICK'), 0, 0, 110, { italic: true, spacing: 6 });
  ctx.restore();
  const bk = p(t, c1 - .05, c1 + .5, easeElastic);
  if (bk > 0) {
    ctx.save(); ctx.translate(W / 2, 740); ctx.scale(bk, bk);
    for (let r = 0; r < 3; r++) {
      const ph = ((t - c1) * .8 + r / 3) % 1;
      ctx.beginPath(); ctx.arc(0, 0, 290 + ph * 240, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(10,132,255,${.45 * (1 - ph)})`; ctx.lineWidth = 5; ctx.stroke();
    }
    ctx.beginPath();
    for (let j = 0; j <= 96; j++) {
      const an = j / 96 * Math.PI * 2, rr = 280 + Math.sin(an * 4 + t * 3) * 10 + Math.sin(an * 7 - t * 4) * 6;
      j ? ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr) : ctx.moveTo(Math.cos(an) * rr, Math.sin(an) * rr);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(-80, -100, 20, 0, 0, 320);
    g.addColorStop(0, C.blueHi); g.addColorStop(.6, C.blue); g.addColorStop(1, C.blueDeep);
    ctx.fillStyle = g; glow(C.blue, 100); ctx.fill(); noGlow();
    ctx.beginPath(); ctx.ellipse(-110, -150, 70, 32, -.6, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fill();
    text(s.symbol, 0, -40, fitSize(s.symbol, 460, 230), { italic: true });
    text(tx(s.label), 0, 120, fitSize(tx(s.label), 440, 64, 900, false), { spacing: 3 });
    ctx.restore();
    burst(t, c1 + .1, W / 2, 740, 40);
  }
  const ok = s.odds ? p(t, c2 - .05, c2 + .25, easeOutExpo) : 0;   // analysis-only videos have no odds
  if (ok > 0) {
    ctx.save(); ctx.translate(W / 2, 1160); const zz = lerp(2, 1, ok); ctx.scale(zz, zz); ctx.globalAlpha *= clamp(ok * 2);
    text('@' + (1 + (s.odds - 1) * p(t, c2, c2 + .5)).toFixed(2), 0, 0, 170, { italic: true });
    ctx.restore();
    text(s.book || '', W / 2, 1270, 30, { weight: 700, color: C.blue, spacing: 3, alpha: ok });
  }
  const chips = s.chips || [];
  font(40, 900);
  const ws = chips.map(c => ctx.measureText(tx(c)).width + 80), tw = ws.reduce((x, y) => x + y, 0) + (chips.length - 1) * 30;
  let cx = W / 2 - tw / 2;
  chips.forEach((c, i) => {
    const k = p(t, c3 - .1 + i * .12, c3 + .2 + i * .12, easeBack);
    pill(tx(c), cx + ws[i] / 2, s.odds ? 1400 : 1220, 40, k, i ? { fill: 'rgba(255,255,255,.08)', line: C.white } : {});
    cx += ws[i] + 30;
  });
}

// --- outro: logo build + CTA
function sOutro(t, a, b, s) {
  logo(W / 2, 700, 400, p(t, a + .25, a + .55, easeBack), p(t, a + .55, a + .8, easeBack), p(t, a, a + .6, easeInOut));
  const f = p(t, a + .6, a + .7) * (1 - p(t, a + .7, a + 1.1));
  if (f > 0) { ctx.save(); ctx.globalAlpha = f * .5; const g = ctx.createRadialGradient(W / 2, 700, 0, W / 2, 700, 900); g.addColorStop(0, C.blue); g.addColorStop(1, 'rgba(10,132,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  shock(t, a + .55, W / 2, 700, 200, 900);
  const k1 = p(t, a + .8, a + 1.1);
  text('SVA CONSULT', W / 2, 1110, 80, { alpha: k1, spacing: lerp(40, 14, k1) });
  text('SEE THE GAME DIFFERENTLY', W / 2, 1195, 34, { alpha: p(t, a + 1, a + 1.3), color: C.blue, spacing: 6 });
  pill(tx(s.cta || 'FOLLOW FOR DAILY PICKS'), W / 2, 1360, 40, p(t, a + 1.2, a + 1.5, easeBack), { fill: C.blue, line: C.blue });
  if (s.disclaimer !== false) text('18+ · PLAY RESPONSIBLY', W / 2, 1490, 28, { weight: 700, color: C.grey, spacing: 4, alpha: p(t, a + 1.4, a + 1.7) });
}

const SCENES = { hook: sHook, versus: sVersus, duel: sDuel, totals: sTotals, numbers: sNumbers, model: sModel, pick: sPick, outro: sOutro };
// moments that get camera shake + flash + an impact sound
const IMPACTS = {
  hook: (s, a) => [cue(s, a, 1, 1.6) + .38],
  versus: (s, a) => [a + .05, wordT(s, a, (tx(D.away.short || D.away) || 'x').toLowerCase().slice(0, 4), 1.1) + .15],
  duel: (s, a) => [wordT(s, a, s.bottom.word || 'worst', 1) + .2, cue(s, a, s.pulseCue ?? 1, 1.8) + .1],
  totals: (s, a) => [cue(s, a, 1, 1.4) + .2],
  numbers: (s, a) => s.items.map((_, i) => cue(s, a, i + 1, .7 + i * .7) + .2).concat([cue(s, a, s.items.length + 1, .7 + s.items.length * .7) + .1]),
  model: (s, a) => [cue(s, a, 0, 0) + .4, cue(s, a, 1, 1.8) + .6],
  pick: (s, a) => s.odds ? [cue(s, a, 1, 1) + .1, cue(s, a, 2, 2) + .2] : [cue(s, a, 1, 1) + .1],   // nothing on "The pick" so the word stays clear
  outro: (s, a) => [a + .55],
};
const TRANSITIONS = ['slash', 'whip', 'zoom', 'glitch'];

// ======================= COMPOSITOR =======================
let TL = [], CUTS = [], HITS = [], WORDS = [], CHUNKS = [];

function buildTimeline() {
  let a = 0;
  TL = D.scenes.map((s, i) => { const r = { s, a, b: a + (s.len || s.dur), i }; a = r.b; return r; });
  DUR = a;
  CUTS = TL.slice(1).map((r, i) => ({ t: r.a, type: (D.transitions || TRANSITIONS)[i % (D.transitions || TRANSITIONS).length] }));
  HITS = [];
  TL.forEach(r => (IMPACTS[r.s.type] ? IMPACTS[r.s.type](r.s, r.a) : []).forEach(t => HITS.push(t)));
  HITS.sort((x, y) => x - y);
  // captions: words grouped into short punchy chunks
  WORDS = [];
  TL.forEach(r => (r.s.words || []).forEach(w => WORDS.push({ w: w.w, t: r.a + w.t, end: /[.!?…]$/.test(w.w) })));
  // "S, V, A." reads as one word on screen
  for (let i = 0; i < WORDS.length - 1; i++) {
    if (/^[A-Z][,.]?$/.test(WORDS[i].w) && /^[A-Z][,.]?$/.test(WORDS[i + 1].w)) {
      WORDS[i].w = WORDS[i].w.replace(/[,.]/g, '') + WORDS[i + 1].w; WORDS[i].end = WORDS[i + 1].end; WORDS.splice(i + 1, 1); i--;
    }
  }
  CHUNKS = [];
  let cur = [];
  WORDS.forEach(w => {
    cur.push(w);
    const len = cur.map(x => x.w).join(' ').length;
    if (w.end || cur.length >= 3 || len > 15) { CHUNKS.push(cur); cur = []; }
  });
  if (cur.length) CHUNKS.push(cur);
}

function sceneAt(t) { for (const r of TL) if (t >= r.a && t < r.b) return r; return TL[TL.length - 1]; }

function drawScene(r, t, canvas) {
  const c = canvas.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, W, H);
  ctx = c;
  ctx.save();
  // slow push-in keeps every scene moving
  const z = 1 + .04 * clamp((t - r.a) / (r.b - r.a));
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  SCENES[r.s.type](t, r.a, r.b, r.s);
  ctx.restore();
  ctx = main;
}

function impactAmt(t) {
  let amt = 0;
  for (const h of HITS) { const d = t - h; if (d >= 0 && d < .35) amt = Math.max(amt, Math.pow(1 - d / .35, 2)); }
  return amt;
}

function ghost(canvas, x, y, vx, alpha = 1) {
  // motion blur: smear copies along the direction of travel
  const n = 7;
  for (let j = n - 1; j >= 0; j--) {
    main.globalAlpha = alpha * (j === 0 ? 1 : .22 * (1 - j / n));
    main.drawImage(canvas, x - vx * j * .5, y);
  }
  main.globalAlpha = 1;
}

function compose(t) {
  const cut = CUTS.find(c => Math.abs(t - c.t) < TR / 2);
  if (!cut) {
    const r = sceneAt(t);
    drawScene(r, t, bufA);
    const amt = impactAmt(t);
    main.save();
    main.translate(W / 2 + Math.sin(t * 97) * 22 * amt, H / 2 + Math.cos(t * 83) * 16 * amt);
    const z = 1 + .05 * amt; main.scale(z, z); main.translate(-W / 2, -H / 2);
    main.drawImage(bufA, 0, 0);
    main.restore();
    if (amt > 0) { main.fillStyle = `rgba(255,255,255,${.16 * amt})`; main.fillRect(0, 0, W, H); }
    return;
  }
  const k = (t - (cut.t - TR / 2)) / TR, e = easeInOut(k);
  const out = TL.find(r => r.b === cut.t), inn = TL.find(r => r.a === cut.t);
  drawScene(out, t, bufA);
  drawScene(inn, t, bufB);
  if (cut.type === 'whip') {
    const v = Math.sin(Math.PI * k) * 180;
    ghost(bufA, -W * 1.1 * e, 0, -v);
    ghost(bufB, W * 1.1 * (1 - e), 0, -v);
  } else if (cut.type === 'zoom') {
    main.save(); main.globalAlpha = 1 - e;
    main.translate(W / 2, H / 2); main.scale(1 + 2.2 * e, 1 + 2.2 * e); main.drawImage(bufA, -W / 2, -H / 2); main.restore();
    main.save(); main.globalAlpha = e;
    main.translate(W / 2, H / 2); const z = .45 + .55 * e; main.scale(z, z); main.drawImage(bufB, -W / 2, -H / 2); main.restore();
    main.fillStyle = `rgba(255,255,255,${.6 * (1 - Math.abs(2 * k - 1))})`; main.fillRect(0, 0, W, H);
  } else if (cut.type === 'glitch') {
    const src = k < .5 ? bufA : bufB, amt = 1 - Math.abs(2 * k - 1);
    for (let y = 0; y < H; y += 40) {
      const sh = (rnd(Math.floor(t * 30) * 7 + y) - .5) * 220 * amt;
      main.drawImage(src, 0, y, W, 40, sh, y, W, 40);
    }
    main.save(); main.globalCompositeOperation = 'lighter'; main.globalAlpha = .45 * amt;
    main.drawImage(src, 18 * amt, 0); main.restore();
    for (let i = 0; i < 6; i++) {
      main.fillStyle = i % 2 ? `rgba(10,132,255,${.5 * amt})` : `rgba(255,255,255,${.35 * amt})`;
      main.fillRect(0, rnd(i + Math.floor(t * 30)) * H, W, 6 + rnd(i * 3) * 30);
    }
  } else {
    // brand slash: a skewed blue band (the logo's slash) sweeps across
    const edge = lerp(-500, W + 500, e), sk = .55;
    const ex = y => edge + (H / 2 - y) * sk;
    main.save();
    main.beginPath(); main.moveTo(ex(0), 0); main.lineTo(W + 600, 0); main.lineTo(W + 600, H); main.lineTo(ex(H), H); main.closePath(); main.clip();
    main.drawImage(bufA, 0, 0); main.restore();
    main.save();
    main.beginPath(); main.moveTo(-600, 0); main.lineTo(ex(0) - 260, 0); main.lineTo(ex(H) - 260, H); main.lineTo(-600, H); main.closePath(); main.clip();
    main.drawImage(bufB, 0, 0); main.restore();
    main.save();
    main.beginPath(); main.moveTo(ex(0) - 260, 0); main.lineTo(ex(0), 0); main.lineTo(ex(H), H); main.lineTo(ex(H) - 260, H); main.closePath();
    const g = main.createLinearGradient(ex(H / 2) - 260, 0, ex(H / 2), 0);
    g.addColorStop(0, C.blueDeep); g.addColorStop(1, C.blueHi);
    main.fillStyle = g; main.shadowColor = C.blue; main.shadowBlur = 80; main.fill();
    main.strokeStyle = C.white; main.lineWidth = 8; main.beginPath(); main.moveTo(ex(0), 0); main.lineTo(ex(H), H); main.stroke();
    main.restore();
  }
}

function captions(t) {
  if (t > DUR - .2) return;
  let ci = -1;
  for (let i = 0; i < CHUNKS.length; i++) if (t >= CHUNKS[i][0].t - .02) ci = i;
  if (ci < 0) return;
  const chunk = CHUNKS[ci], last = chunk[chunk.length - 1];
  const next = CHUNKS[ci + 1];
  if (t > (next ? next[0].t : last.t + 1.2) || t > last.t + 1.4) return;
  ctx = main;
  const words = chunk.map(w => w.w.toUpperCase().replace(/[…,.;:!"]/g, ''));
  let size = 84;
  font(size, 900, true);
  const gap = 24;
  let widths = words.map(w => ctx.measureText(w).width);
  let tw = widths.reduce((x, y) => x + y, 0) + gap * (words.length - 1);
  if (tw > 960) { size *= 960 / tw; font(size, 900, true); widths = words.map(w => ctx.measureText(w).width); tw = 960; }
  const pop = p(t, chunk[0].t - .02, chunk[0].t + .1, easeBack);
  main.save();
  main.translate(W / 2, CAPTION_Y); main.scale(lerp(.7, 1, pop), lerp(.7, 1, pop)); main.translate(-W / 2, -CAPTION_Y);
  let x = W / 2 - tw / 2;
  words.forEach((w, i) => {
    const on = t >= chunk[i].t - .02 && (i === words.length - 1 || t < chunk[i + 1].t);
    const wk = on ? p(t, chunk[i].t - .02, chunk[i].t + .08, easeBack) : 0;
    main.save();
    main.translate(x + widths[i] / 2, CAPTION_Y);
    const z = 1 + .12 * (on ? 1 - wk * .6 : 0); main.scale(z, z);
    ctx = main;
    text(w, 0, 0, size, { italic: true, color: on ? C.blue : C.white, stroke: 14, strokeColor: '#02040A', alpha: t >= chunk[i].t - .02 ? 1 : .55 });
    main.restore();
    x += widths[i] + gap;
  });
  main.restore();
}

function overlays(t) {
  ctx = main;
  // progress bar along the top
  main.fillStyle = 'rgba(255,255,255,.1)'; main.fillRect(0, 0, W, 10);
  main.save(); main.fillStyle = C.blue; main.shadowColor = C.blue; main.shadowBlur = 20;
  main.fillRect(0, 0, W * clamp(t / DUR), 10); main.restore();
  // small watermark (the full logo lands at the end)
  const last = TL[TL.length - 1];
  if (t < last.a) {
    main.save(); main.globalAlpha = .85;
    logo(84, 110, 64, 1, 1, 0);
    text('SVA CONSULT', 140, 104, 28, { align: 'left', spacing: 4 });
    main.restore();
  }
  // vignette + grain
  const g = main.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .78);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)');
  main.fillStyle = g; main.fillRect(0, 0, W, H);
  main.save(); main.globalAlpha = .06; main.globalCompositeOperation = 'overlay';
  const ox = Math.floor(rnd(Math.floor(t * 30)) * 256), oy = Math.floor(rnd(Math.floor(t * 30) + 1) * 256);
  main.translate(-ox, -oy); main.fillStyle = main.createPattern(grainC, 'repeat'); main.fillRect(0, 0, W + 256, H + 256);
  main.restore();
}

function render(t) {
  ctx = main;
  main.setTransform(1, 0, 0, 1, 0, 0); main.globalAlpha = 1;
  background(t);
  compose(t);
  captions(t);
  overlays(t);
}

function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
window.timeline = () => ({ scenes: TL.map(r => r.a), dur: DUR, cuts: CUTS.map(c => c.t), hits: HITS,
  pick: (TL.find(r => r.s.type === 'pick') || {}).a });
window.setup = async data => {
  D = data;
  buildTimeline();
  img.white = await loadImg('assets/mark_white.png');
  img.blue = await loadImg('assets/mark_blue.png');
  grainC.width = grainC.height = 256;
  const gc = grainC.getContext('2d'), id = gc.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = rnd(i) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gc.putImageData(id, 0, 0);
  await document.fonts.load('900 40px Inter');
  await document.fonts.load('italic 900 40px Inter');
  return DUR;
};
window.render = render;

// live preview: template.html?pick=picks/pao-milan.json
(async () => {
  const q = new URLSearchParams(location.search);
  if (!q.get('pick')) return;
  await window.setup(await (await fetch(q.get('pick'))).json());
  const t0 = performance.now();
  const loop = () => { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  loop();
})();
</script>
